<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一年级识字大挑战</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pinyin-pro@3.16.4/dist/index.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');
        
        /* 强制防止左右滑动 */
        html, body {
            overflow-x: hidden;
            max-width: 100vw;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background: #020617;
            color: white;
            touch-action: manipulation; 
        }

        .font-game { font-family: 'ZCOOL KuaiLe', cursive; }

        .evolve-bg {
            animation: pulseBg 2s infinite alternate;
        }
        @keyframes pulseBg {
            from { background-color: #020617; }
            to { background-color: #3b0707; }
        }

        .panel-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .active-red { box-shadow: inset 0 0 150px rgba(239, 68, 68, 0.3); opacity: 1 !important; z-index: 20;}
        .active-blue { box-shadow: inset 0 0 150px rgba(59, 130, 246, 0.3); opacity: 1 !important; z-index: 20;}
        .inactive-panel { opacity: 0.2; filter: grayscale(50%); pointer-events: none;}

        .score-pop {
            animation: scorePop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes scorePop {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            70% { transform: translateY(-80px) scale(1.5); opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        .card-flip {
            animation: flipIn 0.3s ease-out forwards;
        }
        @keyframes flipIn {
            0% { transform: rotateX(90deg); opacity: 0; }
            100% { transform: rotateX(0deg); opacity: 1; }
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            animation: fall linear forwards;
            z-index: 100;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

        @keyframes zoomInOver {
            0% { opacity: 0; transform: scale(0.3); }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-zoom-in {
            animation: zoomInOver 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spinSlow 20s linear infinite;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

        .btn-press { transition: transform 0.1s; }
        .btn-press:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- HTML5 原生背景音乐容器 -->
    <div id="audio-bank" style="display: none;">
        <audio id="bgm-lobby" src="https://assets.mixkit.co/music/preview/mixkit-games-world-beat-464.mp3" loop></audio>
        <audio id="bgm-flashcard" src="https://assets.mixkit.co/music/preview/mixkit-just-chill-16.mp3" loop></audio>
        <audio id="bgm-pk" src="https://assets.mixkit.co/music/preview/mixkit-mighty-retro-puzzle-game-level-1-294.mp3" loop></audio>
    </div>

    <!-- 全局 BGM 音乐开关 -->
    <button id="bgm-btn" onclick="toggleAudio(event)" class="btn-press absolute top-6 right-8 z-[300] bg-slate-800/80 p-4 rounded-full text-4xl shadow-lg border-2 border-slate-600 transition-all hover:scale-110">
        🎵
    </button>

    <div id="app" class="h-screen w-screen max-w-[100vw] overflow-x-hidden flex flex-col relative">
        
        <!-- 1. 首页 -->
        <div id="view-landing" class="flex-1 flex flex-col items-center justify-center p-8 text-center z-10 relative">
            <h1 class="text-[7vw] font-black mb-16 bg-clip-text text-transparent bg-gradient-to-r from-red-500 to-blue-500 font-game italic drop-shadow-2xl">识字大对决</h1>
            <div class="flex flex-row gap-10 w-full max-w-5xl">
                <!-- 第一次点击这里就会自动激活音乐！ -->
                <button onclick="selectMode('flashcard')" class="btn-press flex-1 bg-slate-800/80 border-2 border-slate-600 p-10 rounded-[3rem] shadow-2xl hover:border-green-400 group backdrop-blur-md">
                    <div class="text-[5vw] mb-6 group-hover:scale-110 transition-transform">📇</div>
                    <h2 class="text-4xl font-bold mb-4 text-green-400 font-game">闪卡认读</h2>
                    <p class="text-slate-300 text-lg">生成拼音闪卡，夯实基础</p>
                </button>
                <button onclick="selectMode('pk')" class="btn-press flex-1 bg-slate-800/80 border-2 border-slate-600 p-10 rounded-[3rem] shadow-2xl hover:border-yellow-400 group backdrop-blur-md">
                    <div class="text-[5vw] mb-6 group-hover:scale-110 transition-transform">⚔️</div>
                    <h2 class="text-4xl font-bold mb-4 text-yellow-400 font-game">PK 进化赛</h2>
                    <p class="text-slate-300 text-lg">两班对抗，随机抽查</p>
                </button>
            </div>
            
            <div class="absolute bottom-6 text-slate-500 text-sm max-w-4xl text-center px-4 bg-slate-900/50 p-3 rounded-2xl border border-slate-700/50">
                💡 <b>声音提示：</b>点击以上任意按钮，音乐和纯代码合成音效将瞬间激活，告别拦截烦恼！
            </div>
        </div>

        <!-- 3. PK 配置 -->
        <div id="view-pk-setup" class="hidden flex-1 flex flex-col items-center justify-center p-6 z-10">
            <div class="bg-slate-900/90 border border-slate-700 w-full max-w-6xl rounded-[3rem] p-10 overflow-y-auto max-h-[95vh] custom-scrollbar">
                <h2 class="text-[3vw] font-black mb-2 text-center italic font-game text-yellow-400">设置出战名单</h2>
                <p class="text-center text-slate-300 text-lg mb-8">点击号码<b>打叉</b>标记缺席学生，系统会自动平衡两队轮流次数</p>
                
                <div class="grid grid-cols-2 gap-10">
                    <div class="bg-red-950/40 p-6 rounded-[2rem] border-2 border-red-900/50">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-3xl font-black text-red-500 font-game">红组总人数</h3>
                            <input type="number" id="red-count" value="30" min="1" max="60" class="w-32 bg-slate-900 p-3 rounded-xl text-center text-3xl font-bold border-2 border-red-500/50 text-white outline-none">
                        </div>
                        <div id="red-absent-grid" class="grid grid-cols-6 gap-3"></div>
                    </div>
                    <div class="bg-blue-950/40 p-6 rounded-[2rem] border-2 border-blue-900/50">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-3xl font-black text-blue-500 font-game">蓝组总人数</h3>
                            <input type="number" id="blue-count" value="30" min="1" max="60" class="w-32 bg-slate-900 p-3 rounded-xl text-center text-3xl font-bold border-2 border-blue-500/50 text-white outline-none">
                        </div>
                        <div id="blue-absent-grid" class="grid grid-cols-6 gap-3"></div>
                    </div>
                </div>
                
                <div class="flex gap-4 mt-10">
                    <button onclick="switchView('landing')" class="btn-press px-10 bg-slate-700 rounded-3xl text-2xl font-bold text-white">返回大厅</button>
                    <button onclick="switchView('unit-select')" class="btn-press flex-1 py-5 bg-white text-slate-900 rounded-3xl text-4xl font-black shadow-[0_0_40px_rgba(255,255,255,0.3)] hover:bg-slate-200 transition-colors font-game">下一步：选择词库</button>
                </div>
            </div>
        </div>

        <!-- 2. 单元选择 -->
        <div id="view-unit-select" class="hidden flex-1 flex flex-col items-center justify-center p-6 z-10">
            <div class="bg-slate-900/90 border border-slate-700 w-full max-w-6xl rounded-[3rem] shadow-2xl p-10 flex flex-col h-[85vh]">
                <h2 class="text-3xl font-black mb-6 text-center text-white">选择要学习/比赛的单元</h2>
                <div id="unit-grid" class="flex-1 overflow-y-auto grid grid-cols-5 gap-4 p-2 custom-scrollbar"></div>
                <div class="mt-8 flex gap-6">
                    <button onclick="confirmUnits()" class="btn-press flex-1 py-5 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl text-3xl font-bold shadow-xl text-white font-game">开启对决 / 开始认读</button>
                    <button onclick="goBackFromUnitSelect()" class="btn-press px-12 bg-slate-700 rounded-2xl text-2xl font-bold text-white hover:bg-slate-600">返回</button>
                </div>
            </div>
        </div>

        <!-- 4. 闪卡模式 -->
        <div id="view-flashcard" class="hidden flex-1 flex flex-col items-center justify-center p-6 z-10 w-full relative">
            <button onclick="switchView('unit-select')" class="btn-press absolute top-8 left-8 px-6 py-3 bg-slate-800 rounded-xl font-bold text-lg hover:bg-slate-700 text-white z-50">← 退出</button>
            
            <div id="fc-click-area" class="w-full flex-1 flex flex-col items-center justify-center cursor-pointer" onclick="nextFlashcard()">
                <div id="fc-card" class="bg-white rounded-[4rem] flex flex-col items-center justify-center shadow-[0_20px_60px_rgba(255,255,255,0.1)] border-8 border-slate-200" style="width: 65vw; height: 60vh;">
                    <div id="fc-pinyin" class="text-slate-500 font-bold mb-6 tracking-widest font-sans" style="font-size: 4.5vw;">pīn yīn</div>
                    <div id="fc-word" class="font-black text-slate-900 leading-none" style="font-size: 13vw;">词汇</div>
                </div>
                <div class="mt-8 text-lg font-bold text-slate-400 bg-slate-800/80 px-6 py-2 rounded-full">
                    点击屏幕任意处切换下一个 (<span id="fc-progress" class="text-white">0/0</span>)
                </div>
            </div>

            <div id="fc-finish" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-[200] backdrop-blur-2xl overflow-hidden">
                <div class="absolute inset-0 flex items-center justify-center opacity-40 animate-spin-slow pointer-events-none">
                    <div class="w-[100%] h-[100%] bg-[conic-gradient(from_0deg,transparent_0_300deg,white_360deg)] rounded-full blur-[80px] scale-[1.5]"></div>
                </div>
                <div class="absolute inset-0 flex items-center justify-center opacity-60 animate-pulse pointer-events-none">
                    <div class="w-[80%] h-[80%] bg-yellow-500/40 rounded-full blur-[120px]"></div>
                </div>
                <div class="absolute top-32 left-32 text-7xl animate-bounce" style="animation-delay: 0.1s">⭐</div>
                <div class="absolute bottom-32 right-32 text-8xl animate-bounce" style="animation-delay: 0.4s">🌟</div>
                <div class="absolute top-1/4 right-40 text-6xl animate-pulse">✨</div>
                <div class="absolute bottom-1/4 left-40 text-7xl animate-pulse" style="animation-delay: 0.3s">🎊</div>

                <div class="relative z-10 flex flex-col items-center animate-zoom-in">
                    <div class="relative mb-10">
                        <div class="absolute inset-0 bg-white/50 rounded-full blur-3xl opacity-80 animate-pulse"></div>
                        <div class="text-[10vw] leading-none animate-bounce drop-shadow-[0_0_80px_rgba(255,255,255,1)] relative z-10 hover:scale-110 transition-transform cursor-pointer">🎉</div>
                    </div>
                    <h2 class="text-[5vw] font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-amber-400 to-green-400 mb-16 font-game drop-shadow-[0_20px_50px_rgba(251,191,36,0.6)]">绝杀！全部读完！</h2>
                    <div class="flex gap-8">
                        <button onclick="shuffleAndRestartFlashcard()" class="btn-press px-12 py-6 bg-gradient-to-b from-green-400 to-green-600 text-white rounded-full text-4xl font-black shadow-[0_20px_60px_rgba(34,197,94,0.8)] border-4 border-white hover:scale-105 transition-all font-game">乱序再战 ⚔️</button>
                        <button onclick="switchView('unit-select')" class="btn-press px-12 py-6 bg-slate-800 text-white rounded-full text-4xl font-black shadow-[0_20px_60px_rgba(0,0,0,0.8)] border-4 border-slate-500 hover:scale-105 transition-all font-game hover:bg-slate-700">换新词库 📚</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 5. PK 赛倒数预热 -->
        <div id="view-pk-countdown" class="hidden absolute inset-0 bg-slate-900 flex items-center justify-center z-[100]">
            <div id="pk-countdown-num" class="text-[25rem] font-black text-white font-game drop-shadow-[0_0_100px_rgba(255,255,255,0.8)]">5</div>
        </div>

        <!-- 6. PK 战场 -->
        <div id="view-pk-game" class="hidden flex-1 flex relative overflow-hidden">
            <div class="absolute top-4 inset-x-0 z-50 pointer-events-none flex flex-col items-center w-full">
                <button onclick="switchView('landing')" class="btn-press pointer-events-auto absolute left-6 top-0 px-5 py-2 bg-slate-800 rounded-xl font-bold text-white hover:bg-slate-700 shadow-lg border border-slate-600 transition-colors z-[60] text-sm">
                    ← 返回大厅
                </button>
                <div id="round-label" class="bg-slate-900/95 px-8 py-2 rounded-full border-2 border-slate-600 text-2xl font-bold mb-2 shadow-2xl">
                    第 <span id="round-display" class="text-yellow-400 text-3xl">1</span> 轮 / 共 <span id="max-round-display">--</span> 轮
                </div>
                <div id="speed-warning" class="hidden bg-red-600 text-white px-6 py-1.5 rounded-full font-black text-2xl italic animate-bounce shadow-[0_0_30px_rgba(239,68,68,0.8)] border-2 border-white">
                    🔥 进化阶段：速度加快，得分双倍！ 🔥
                </div>
            </div>

            <!-- 红组 -->
            <div id="panel-red" class="flex-1 flex flex-col panel-transition relative z-10 border-r-4 border-slate-800">
                <div class="p-8 pt-20 bg-red-600/10">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex flex-col">
                            <span class="text-4xl font-black text-red-500 font-game mb-3">红组</span>
                            <button onclick="manualScore('red', -5)" class="btn-press px-4 py-2 bg-red-900/60 hover:bg-red-600 text-white text-lg font-bold rounded-lg border border-red-500 transition-all pointer-events-auto">犯规 -5</button>
                        </div>
                        <div class="text-[6rem] leading-none font-black text-white tabular-nums drop-shadow-lg" id="score-red">0</div>
                    </div>
                    <div id="timer-container-red" class="invisible mt-6">
                        <div class="flex justify-between items-end mb-2">
                            <span class="text-red-400 font-bold text-xl">响应倒计时</span>
                            <span id="timer-num-red" class="text-5xl font-black text-red-500 font-game">7</span>
                        </div>
                        <div class="h-4 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                            <div id="timer-bar-red" class="h-full bg-gradient-to-r from-red-600 to-red-400 w-full transition-all duration-1000 ease-linear"></div>
                        </div>
                    </div>
                </div>
                <div class="flex-1 flex flex-col items-center justify-center p-6 pb-32 relative w-full">
                    <div id="lottery-red" class="text-center flex flex-col items-center justify-center w-full">
                        <div class="text-slate-400 text-3xl mb-4 font-bold opacity-0 transition-opacity" id="label-red">准备点名...</div>
                        <div class="text-[14rem] font-black leading-none font-game text-red-500 drop-shadow-[0_0_50px_rgba(239,68,68,0.5)]" id="num-red">--</div>
                    </div>
                    <div id="card-red" class="hidden bg-white rounded-[3rem] flex flex-col items-center justify-center text-center shadow-[0_30px_100px_rgba(239,68,68,0.4)] border-8 border-red-500 overflow-hidden" style="width: 32vw; height: 35vh;">
                        <div class="text-slate-500 font-bold mb-3 font-sans tracking-widest" id="pinyin-red" style="font-size: 3vw;">--</div>
                        <div class="font-black text-slate-900 leading-tight whitespace-nowrap transition-all" id="word-red" style="font-size: 6vw;">--</div>
                    </div>
                </div>
            </div>

            <!-- 蓝组 -->
            <div id="panel-blue" class="flex-1 flex flex-col panel-transition relative z-10">
                <div class="p-8 pt-20 bg-blue-600/10">
                    <div class="flex justify-between items-start mb-2">
                        <div class="text-[6rem] leading-none font-black text-white tabular-nums drop-shadow-lg" id="score-blue">0</div>
                        <div class="flex flex-col items-end">
                            <span class="text-4xl font-black text-blue-500 font-game mb-3">蓝组</span>
                            <button onclick="manualScore('blue', -5)" class="btn-press px-4 py-2 bg-blue-900/60 hover:bg-blue-600 text-white text-lg font-bold rounded-lg border border-blue-500 transition-all pointer-events-auto">犯规 -5</button>
                        </div>
                    </div>
                    <div id="timer-container-blue" class="invisible mt-6 text-right">
                        <div class="flex justify-between items-end mb-2">
                            <span id="timer-num-blue" class="text-5xl font-black text-blue-500 font-game">7</span>
                            <span class="text-blue-400 font-bold text-xl">响应倒计时</span>
                        </div>
                        <div class="h-4 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                            <div id="timer-bar-blue" class="h-full bg-gradient-to-l from-blue-400 to-blue-600 w-full transition-all duration-1000 ease-linear float-right"></div>
                        </div>
                    </div>
                </div>
                <div class="flex-1 flex flex-col items-center justify-center p-6 pb-32 relative w-full">
                    <div id="lottery-blue" class="text-center flex flex-col items-center justify-center w-full">
                        <div class="text-slate-400 text-3xl mb-4 font-bold opacity-0 transition-opacity" id="label-blue">准备点名...</div>
                        <div class="text-[14rem] font-black leading-none font-game text-blue-500 drop-shadow-[0_0_50px_rgba(59,130,246,0.5)]" id="num-blue">--</div>
                    </div>
                    <div id="card-blue" class="hidden bg-white rounded-[3rem] flex flex-col items-center justify-center text-center shadow-[0_30px_100px_rgba(59,130,246,0.4)] border-8 border-blue-500 overflow-hidden" style="width: 32vw; height: 35vh;">
                        <div class="text-slate-500 font-bold mb-3 font-sans tracking-widest" id="pinyin-blue" style="font-size: 3vw;">--</div>
                        <div class="font-black text-slate-900 leading-tight whitespace-nowrap transition-all" id="word-blue" style="font-size: 6vw;">--</div>
                    </div>
                </div>
            </div>

            <!-- 控制区 -->
            <div class="absolute inset-x-0 bottom-6 pointer-events-none flex flex-col items-center z-[60]">
                <button id="btn-correct" onclick="processResult(true)" class="btn-press hidden pointer-events-auto bg-gradient-to-b from-green-400 to-green-600 text-white rounded-full font-black shadow-[0_15px_40px_rgba(34,197,94,0.6)] border-4 border-white font-game flex items-center justify-center" style="width: 20rem; height: 6rem; font-size: 2.5rem;">
                    答对 +分 ✓
                </button>
            </div>
        </div>

        <!-- 7. 最终结算 -->
        <div id="view-result" class="hidden absolute inset-0 bg-slate-900/98 z-[100] flex flex-col items-center justify-center p-10 backdrop-blur-xl">
            <h2 class="text-5xl font-black mb-12 text-slate-400 font-game tracking-widest">战况结算</h2>
            <div class="flex gap-24 items-end mb-16 w-full max-w-5xl justify-center">
                <div class="text-center group flex-1">
                    <div class="text-red-500 text-4xl font-bold mb-6 group-hover:scale-110 transition-transform font-game">红组</div>
                    <div id="final-score-red" class="text-[12vw] font-black text-white leading-none drop-shadow-[0_0_40px_rgba(239,68,68,0.5)]">0</div>
                </div>
                <div class="text-[6vw] font-bold text-slate-600 pb-8 italic font-game">VS</div>
                <div class="text-center group flex-1">
                    <div class="text-blue-500 text-4xl font-bold mb-6 group-hover:scale-110 transition-transform font-game">蓝组</div>
                    <div id="final-score-blue" class="text-[12vw] font-black text-white leading-none drop-shadow-[0_0_40px_rgba(59,130,246,0.5)]">0</div>
                </div>
            </div>
            <div id="winner-announcement" class="text-[6vw] font-black bg-clip-text text-transparent bg-gradient-to-b from-yellow-300 via-amber-500 to-orange-600 mb-12 font-game drop-shadow-[0_10px_30px_rgba(251,191,36,0.5)]">
                --
            </div>
            <div class="flex flex-wrap justify-center gap-6">
                <button onclick="startPKCountdown()" class="btn-press px-8 py-5 bg-green-500 text-white rounded-full text-3xl font-black hover:bg-green-400 transition-colors shadow-2xl">原班人马 再战</button>
                <button onclick="switchView('unit-select')" class="btn-press px-8 py-5 bg-slate-700 text-white rounded-full text-3xl font-black hover:bg-slate-600 transition-colors shadow-2xl">重选词库</button>
                <button onclick="switchView('landing')" class="btn-press px-8 py-5 bg-slate-900 border-2 border-slate-700 text-slate-300 rounded-full text-3xl font-black hover:bg-slate-800 transition-colors shadow-2xl">返回大厅</button>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // 终极音频引擎：代码合成(SFX) + HTML5(BGM)
        // 彻底解决防盗链和移动端浏览器拦截问题
        // ==========================================
        let isAudioMuted = false;
        let audioCtx = null;
        let currentBGM = 'bgm-lobby'; 
        let audioUnlocked = false;

        const bgms = {
            'bgm-lobby': document.getElementById('bgm-lobby'),
            'bgm-flashcard': document.getElementById('bgm-flashcard'),
            'bgm-pk': document.getElementById('bgm-pk')
        };

        Object.values(bgms).forEach(a => {
            a.volume = 0.25;
        });

        // 1. 初始化纯代码发声引擎
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            // 第一次点击解锁所有 HTML5 音乐标签
            if (!audioUnlocked) {
                audioUnlocked = true;

        // 2. 网页端最强纯代码音效合成器 (100%零延迟，无需下载)
        function playSynthSfx(type) {
            if (isAudioMuted || !audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch(type) {
                case 'click': // 清脆滴声
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, t);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                    osc.start(t); osc.stop(t + 0.1);
                    break;
                case 'flip': // 翻卡短促滑音
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, t);
                    osc.frequency.exponentialRampToValueAtTime(800, t + 0.1);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
                    osc.start(t); osc.stop(t + 0.1);
                    break;
                case 'correct': // 答对上升音效 (C5-E5-G5)
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, t);
                    osc.frequency.setValueAtTime(659.25, t + 0.1);
                    osc.frequency.setValueAtTime(783.99, t + 0.2);
                    gain.gain.setValueAtTime(0.15, t);
                    gain.gain.linearRampToValueAtTime(0, t + 0.4);
                    osc.start(t); osc.stop(t + 0.4);
                    break;
                case 'wrong': // 答错/没反应下降音效
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, t);
                    osc.frequency.linearRampToValueAtTime(100, t + 0.3);
                    gain.gain.setValueAtTime(0.15, t);
                    gain.gain.linearRampToValueAtTime(0, t + 0.3);
                    osc.start(t); osc.stop(t + 0.3);
                    break;
                case 'pkStart': // PK震撼开局
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, t);
                    osc.frequency.exponentialRampToValueAtTime(50, t + 0.8);
                    gain.gain.setValueAtTime(0.2, t);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.8);
                    osc.start(t); osc.stop(t + 0.8);
                    break;
                case 'evolve': // 进化警报音
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, t);
                    osc.frequency.linearRampToValueAtTime(1200, t + 0.8);
                    gain.gain.setValueAtTime(0.15, t);
                    gain.gain.linearRampToValueAtTime(0, t + 0.8);
                    osc.start(t); osc.stop(t + 0.8);
                    break;
                case 'victory': // 胜利号角
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'square';
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.1, t + i*0.15);
                        g.gain.exponentialRampToValueAtTime(0.01, t + (i+1)*0.15);
                        o.connect(g); g.connect(audioCtx.destination);
                        o.start(t + i*0.15); o.stop(t + (i+1)*0.15);
                    });
                    break;
                case 'tick': // 短促倒数/滚动音
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800 + Math.random()*200, t);
                    gain.gain.setValueAtTime(0.05, t);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
                    osc.start(t); osc.stop(t + 0.05);
                    break;
                case 'ding': // 确认高音
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1000, t);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
                    osc.start(t); osc.stop(t + 0.3);
                    break;
            }
        }

        function initPKGame() {
            const rc = parseInt(document.getElementById('red-count').value);
            const bc = parseInt(document.getElementById('blue-count').value);
            rosters.red = Array.from({length: rc}, (_, i) => i + 1).filter(n => !redAbsent.has(n));
            rosters.blue = Array.from({length: bc}, (_, i) => i + 1).filter(n => !blueAbsent.has(n));
            rosters.usedRed = [];
            rosters.usedBlue = [];

            pkState.maxRound = Math.max(rosters.red.length, rosters.blue.length);
            pkState.turnQueue = [];
            for(let i=0; i<pkState.maxRound; i++) {
                if (i < 14) pkState.turnQueue.push('red', 'blue');
            }
            let remainingRounds = pkState.maxRound - 14;
            if(remainingRounds > 0) {
                let evolveTurns = [];
                for(let i=0; i<remainingRounds; i++) evolveTurns.push('red', 'blue');
                evolveTurns.sort(() => Math.random() - 0.5);
                pkState.turnQueue = pkState.turnQueue.concat(evolveTurns);
            }

            pkState.scores = { red: 0, blue: 0 };
            document.getElementById('score-red').innerText = '0';
            document.getElementById('score-blue').innerText = '0';
            pkState.baseTimer = 7;
            pkState.isEvolving = false;
            document.body.classList.remove('evolve-bg');
            document.getElementById('speed-warning').classList.add('hidden');
            pkState.currentPool = [];
            pkState.turnsPlayed = 0;
            document.getElementById('max-round-display').innerText = pkState.maxRound;

                playSynthSfx('evolve'); 
                document.body.classList.add('evolve-bg');

            document.getElementById('round-display').innerText = Math.min(displayRound, pkState.maxRound);

            document.getElementById(`card-blue`).classList.add('hidden');
            document.getElementById('btn-correct').classList.add('hidden');
            
            let rosterKey = team;
            let usedKey = team === 'red' ? 'usedRed' : 'usedBlue';
            if (rosters[rosterKey].length === 0) {
                rosters[rosterKey] = [...rosters[usedKey]];
                rosters[usedKey] = [];
            }
            const idx = Math.floor(Math.random() * rosters[rosterKey].length);
            const studentNum = rosters[rosterKey].splice(idx, 1)[0];
            rosters[usedKey].push(studentNum);

            const label = document.getElementById(`label-${team}`);
            const numDisplay = document.getElementById(`num-${team}`);
            document.getElementById(`lottery-${team}`).classList.remove('hidden');
            label.classList.remove('opacity-0');

            const validRollNumbers = [...rosters[rosterKey], ...rosters[usedKey]];
            let count = 0;
            const roller = setInterval(() => {
                playSynthSfx('tick'); // 合成滚动音效
                numDisplay.innerText = validRollNumbers[Math.floor(Math.random() * validRollNumbers.length)];

            if (word.length <= 2) wordEl.style.fontSize = '6.5vw';
            else if (word.length === 3) wordEl.style.fontSize = '5vw';
            else wordEl.style.fontSize = '3.5vw';

            document.getElementById(`pinyin-${team}`).innerText = py;
            playSynthSfx('flip'); 
            
            card.classList.remove('card-flip');
            void card.offsetWidth;
            card.classList.add('card-flip');
            card.classList.remove('hidden');
            document.getElementById('btn-correct').classList.remove('hidden');
            startCountdown(team);
        }

        function startCountdown(team) {
            clearInterval(pkState.timerInterval);
            pkState.timer = pkState.baseTimer;
            pkState.timeLeft = pkState.timer;
            const num = document.getElementById(`timer-num-${team}`);
            const bar = document.getElementById(`timer-bar-${team}`);
            document.getElementById(`timer-container-${team}`).classList.remove('invisible');
            
            num.innerText = pkState.timeLeft;
            bar.style.transition = 'none';
            bar.style.width = "100%";
            void bar.offsetWidth;
            bar.style.transition = 'width 1s linear';

            pkState.timerInterval = setInterval(() => {
                pkState.timeLeft -= 1;
                num.innerText = Math.max(0, pkState.timeLeft);
                bar.style.width = (pkState.timeLeft / pkState.timer * 100) + "%";
                
                if(pkState.timeLeft > 0 && pkState.timeLeft <= 3) {
                    playSynthSfx('tick'); 
                }

                if (pkState.timeLeft <= 0) {
                    clearInterval(pkState.timerInterval);
                    processResult(false); 
                }
            }, 1000);
        }

        function processResult(isCorrect) {
            clearInterval(pkState.timerInterval);
            document.getElementById('btn-correct').classList.add('hidden'); 
            if (isCorrect) {
                playSynthSfx('correct'); // 合成答对音效
                let earned = 10 + Math.ceil(pkState.timeLeft) * 2;
                if (pkState.isEvolving) earned *= 2; 
                addScore(pkState.currentTurnTeam, earned);
            } else {
                playSynthSfx('wrong'); // 合成答错音效
            }
            setTimeout(() => { nextPKTurn(); }, 1000);
        }

        function addScore(team, points) {
            pkState.scores[team] += points;
            const el = document.getElementById(`score-${team}`);
            el.innerText = pkState.scores[team];
            const pop = document.createElement('div');
            pop.className = "absolute -top-10 left-1/2 -translate-x-1/2 text-5xl font-black text-yellow-400 score-pop z-[100] font-game drop-shadow-lg";
            pop.innerText = `+${points}`;
            el.parentElement.appendChild(pop);
            setTimeout(() => pop.remove(), 1000);
        }

        function manualScore(team, points) {
            pkState.scores[team] += points;
            if (pkState.scores[team] < 0) pkState.scores[team] = 0; 
            const el = document.getElementById(`score-${team}`);
            el.innerText = pkState.scores[team];
            playSynthSfx('wrong'); // 合成扣分音效
            const pop = document.createElement('div');
            pop.className = "absolute -top-10 left-1/2 -translate-x-1/2 text-5xl font-black text-red-500 score-pop z-[100] font-game drop-shadow-lg";
            pop.innerText = points; 
            el.parentElement.appendChild(pop);
            setTimeout(() => pop.remove(), 1000);
        }

        function showFinalResult() {
            document.getElementById(`panel-red`).classList.remove('active-red', 'inactive-panel');
            document.getElementById(`panel-blue`).classList.remove('active-blue', 'inactive-panel');
            document.body.classList.remove('evolve-bg');
            playSynthSfx('victory'); 
            switchView('result'); 
            document.getElementById('final-score-red').innerText = pkState.scores.red;
            document.getElementById('final-score-blue').innerText = pkState.scores.blue;
            
            const winLabel = document.getElementById('winner-announcement');
            if (pkState.scores.red > pkState.scores.blue) {
                winLabel.innerText = "🏆 恭喜红组 获得胜利！";
                winLabel.className = "text-[6vw] font-black bg-clip-text text-transparent bg-gradient-to-b from-red-400 to-red-600 mb-12 font-game drop-shadow-[0_10px_30px_rgba(239,68,68,0.5)]";
            } else if (pkState.scores.blue > pkState.scores.red) {
                winLabel.innerText = "🏆 恭喜蓝组 获得胜利！";
                winLabel.className = "text-[6vw] font-black bg-clip-text text-transparent bg-gradient-to-b from-blue-400 to-blue-600 mb-12 font-game drop-shadow-[0_10px_30px_rgba(59,130,246,0.5)]";
            } else {
                winLabel.innerText = "🤝 旗鼓相当 平局！";
                winLabel.className = "text-[6vw] font-black bg-clip-text text-transparent bg-gradient-to-b from-slate-300 to-slate-500 mb-12 font-game drop-shadow-lg";
            }
            spawnConfetti('view-result', 100);
        }

        function spawnConfetti(containerId, amount) {
            const container = document.getElementById(containerId);
            container.querySelectorAll('.confetti').forEach(e => e.remove());
            const colors = ['#ef4444','#3b82f6','#fbbf24','#22c55e', '#a855f7'];
            for(let i=0; i<amount; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.top = -10 - Math.random() * 20 + 'vh';
                c.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                c.style.animationDuration = 2 + Math.random() * 3 + 's';
                c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                container.appendChild(c);
            }
        }
    </script>
</body>
</html>
