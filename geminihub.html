<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDP Gemini SJK (C) KUO KUANG 2 | Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.05);
        }
        .bento-card {
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .bento-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 40px 60px -15px rgba(0, 0, 0, 0.08);
            border-color: #6366f1;
        }
        .star-active { fill: #f59e0b; color: #f59e0b; }
        .star-inactive { color: #cbd5e1; }
        .gradient-primary { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-900 min-h-screen">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, setDoc, deleteDoc, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBezpJ9_6vPH7oUQyouhy1EoJNiXvciC0o",
            authDomain: "ldp-portal-8b38f.firebaseapp.com",
            projectId: "ldp-portal-8b38f",
            storageBucket: "ldp-portal-8b38f.firebasestorage.app",
            messagingSenderId: "378526911975",
            appId: "1:378526911975:web:2b14ea6ca18fefd6f34142",
            measurementId: "G-QR638Q5SBJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        
        // 🚀 尝试使用您可能有资料的下一个 ID
        const currentAppId = 'ldp-kuo-kuang-2'; 

        window.fb = { auth, db, currentAppId, collection, onSnapshot, doc, updateDoc, addDoc, setDoc, deleteDoc, increment, signInAnonymously, onAuthStateChanged, signInWithPopup, provider, signOut, arrayUnion };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { auth, db, currentAppId, collection, onSnapshot, doc, updateDoc, addDoc, setDoc, deleteDoc, increment, signInAnonymously, onAuthStateChanged, signInWithPopup, provider, signOut, arrayUnion } = window.fb;

        // 🛠️ 管理员邮箱
        const ADMIN_EMAILS = ["yquan77@gmail.com", "yquan77@moe-dl.edu.my"];

        const SUBJECTS = ["Matematik", "Sains", "Bahasa Melayu", "Bahasa Cina", "Bahasa Inggeris", "RBT", "Sejarah", "Pend. Islam", "Pend. Moral", "PSV", "Muzik", "PJ & PK"];
        const YEARS = ["Tahun 1", "Tahun 2", "Tahun 3", "Tahun 4", "Tahun 5", "Tahun 6"];
        const TYPES = ["Latihan", "Pengajaran", "Permainan", "Alatan/Tools"];

        // 视觉映射：根据标题或科目赋予色彩和图标
        const getVisualSet = (name = "", sub = "") => {
            const s = (name + sub).toLowerCase();
            if (s.includes("数学") || s.includes("matematik")) return { i: "calculator", c: "bg-blue-600", l: "bg-blue-50", t: "text-blue-700" };
            if (s.includes("科学") || s.includes("sains")) return { i: "flask-conical", c: "bg-emerald-600", l: "bg-emerald-50", t: "text-emerald-700" };
            if (s.includes("游戏") || s.includes("game")) return { i: "gamepad-2", c: "bg-purple-600", l: "bg-purple-50", t: "text-purple-700" };
            if (s.includes("文") || s.includes("bahasa")) return { i: "book-open", c: "bg-orange-600", l: "bg-orange-50", t: "text-orange-700" };
            if (s.includes("识字") || s.includes("flashcard")) return { i: "layers", c: "bg-rose-600", l: "bg-rose-50", t: "text-rose-700" };
            return { i: "sparkles", c: "bg-indigo-600", l: "bg-indigo-50", t: "text-indigo-700" };
        };

        const App = () => {
            const [lang, setLang] = useState('zh');
            const [user, setUser] = useState(null);
            const [projects, setProjects] = useState([]);
            const [stats, setStats] = useState({ totalViews: 0, totalClicks: 0, totalProjects: 0 });
            const [loading, setLoading] = useState(true);
            const [modal, setModal] = useState(null); // 'create' | 'edit'
            const [form, setForm] = useState({ name: '', link: '', subject: 'Matematik', year: 'Tahun 1', type: 'Permainan' });
            const [filters, setFilters] = useState({ subject: 'All', year: 'All', type: 'All' });

            const isAdmin = useMemo(() => user && ADMIN_EMAILS.includes(user.email), [user]);

            const t = {
                zh: { h1: "AI 教学资源中心", sub: "SJK (C) KUO KUANG 2", g: "Google 账号登录", guest: "以访客身份进入", pub: "发布作品", my: "我的贡献", noData: "暂无作品资料", admin: "管理员模式", edit: "编辑资料", del: "删除作品", cancel: "取消", save: "确认提交" },
                ms: { h1: "Pusat Sumber AI", sub: "SJK (C) KUO KUANG 2", g: "Log Masuk Google", guest: "Masuk Tetamu", pub: "Hantar Karya", my: "Sumbangan Saya", noData: "Tiada Data", admin: "Mode Admin", edit: "Kemaskini", del: "Padam", cancel: "Batal", save: "Simpan" }
            }[lang];

            useEffect(() => {
                const unsub = onAuthStateChanged(auth, u => { setUser(u); if(!u) setLoading(false); });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!user) return;
                const statRef = doc(db, 'artifacts', currentAppId, 'public', 'data', 'stats', 'global');
                setDoc(statRef, { totalViews: increment(1) }, { merge: true });
                const unsubP = onSnapshot(collection(db, 'artifacts', currentAppId, 'public', 'data', 'projects'), s => {
                    setProjects(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0)));
                    setLoading(false);
                });
                const unsubS = onSnapshot(statRef, d => d.exists() && setStats(d.data()));
                return () => { unsubP(); unsubS(); };
            }, [user]);

            useEffect(() => { lucide.createIcons(); }, [user, projects, loading, modal, lang]);

            const handleSave = async (e) => {
                e.preventDefault();
                if (modal === 'edit') {
                    await updateDoc(doc(db, 'artifacts', currentAppId, 'public', 'data', 'projects', form.id), form);
                } else {
                    await addDoc(collection(db, 'artifacts', currentAppId, 'public', 'data', 'projects'), { ...form, creatorId: user.uid, creatorName: user.displayName || 'Teacher', creatorPhoto: user.photoURL || null, timestamp: Date.now(), views: 0, clicks: 0, stars: 0, ratingCount: 0, votedUsers: [] });
                    await updateDoc(doc(db, 'artifacts', currentAppId, 'public', 'data', 'stats', 'global'), { totalProjects: increment(1) });
                }
                setModal(null);
                setForm({ name: '', link: '', subject: 'Matematik', year: 'Tahun 1', type: 'Permainan' });
            };

            const handleRate = async (p, val) => {
                if (p.votedUsers?.includes(user.uid)) return;
                const newStars = ((p.stars * p.ratingCount) + val) / (p.ratingCount + 1);
                await updateDoc(doc(db, 'artifacts', currentAppId, 'public', 'data', 'projects', p.id), { stars: Number(newStars.toFixed(1)), ratingCount: increment(1), votedUsers: arrayUnion(user.uid) });
            };

            const filtered = projects.filter(p => (filters.subject === 'All' || p.subject === filters.subject) && (filters.year === 'All' || p.year === filters.year) && (filters.type === 'All' || p.type === filters.type));

            if (!user) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
                    <div className="glass-panel max-w-md w-full p-12 rounded-[4rem] text-center shadow-2xl relative overflow-hidden">
                        <button onClick={() => setLang(lang === 'zh' ? 'ms' : 'zh')} className="absolute top-8 right-10 text-xs font-bold text-indigo-600 border border-indigo-100 px-3 py-1 rounded-full">{lang==='zh'?'BM':'中文'}</button>
                        <div className="gradient-primary w-24 h-24 rounded-[2rem] mx-auto mb-8 flex items-center justify-center text-white shadow-2xl rotate-6"><i data-lucide="sparkles" className="w-12 h-12"></i></div>
                        <h1 className="text-3xl font-black mb-2">{t.h1}</h1>
                        <p className="text-slate-400 font-bold mb-12 text-[10px] tracking-widest">{t.sub}</p>
                        <div className="space-y-4">
                            <button onClick={()=>signInWithPopup(auth, provider)} className="w-full py-5 bg-slate-900 text-white rounded-3xl font-bold flex items-center justify-center gap-3 shadow-xl hover:scale-[1.02] transition-transform"><img src="https://www.google.com/favicon.ico" className="w-5 h-5 brightness-200" /> {t.g}</button>
                            <button onClick={()=>signInAnonymously(auth)} className="w-full py-5 bg-white text-slate-500 border border-slate-100 rounded-3xl font-bold hover:bg-slate-50 transition-colors">{t.guest}</button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="max-w-7xl mx-auto px-6 py-12">
                    {/* Header */}
                    <header className="flex flex-col md:flex-row md:items-center justify-between gap-8 mb-20">
                        <div className="flex items-center gap-6">
                            <div className="gradient-primary p-5 rounded-[1.5rem] text-white shadow-2xl shadow-indigo-200"><i data-lucide="gem" className="w-8 h-8"></i></div>
                            <div><h1 className="text-4xl font-black tracking-tighter">Gemini Hub</h1><p className="text-slate-400 text-[10px] font-black uppercase tracking-[0.3em] mt-1">{t.sub}</p></div>
                        </div>
                        <div className="flex items-center gap-4">
                            {isAdmin && <span className="bg-rose-100 text-rose-600 px-4 py-2 rounded-full text-[10px] font-black tracking-widest shadow-sm">MASTER ADMIN</span>}
                            <button onClick={() => setLang(lang === 'zh' ? 'ms' : 'zh')} className="glass-panel px-6 py-3 rounded-full text-xs font-bold text-indigo-600"><i data-lucide="languages" className="w-4 h-4 inline mr-2"></i>{lang==='zh'?'BAHASA MELAYU':'中文界面'}</button>
                            {!user.isAnonymous && <button onClick={()=>setModal('create')} className="px-8 py-3.5 gradient-primary text-white font-bold rounded-2xl shadow-xl hover:scale-105 transition-all">{t.pub}</button>}
                            <div className="flex items-center gap-3 glass-panel p-1.5 pr-6 rounded-full border-white">
                                {user.photoURL ? <img src={user.photoURL} className="w-10 h-10 rounded-full border-2 border-white shadow-sm" /> : <div className="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center"><i data-lucide="user" className="w-5 h-5 text-slate-300"></i></div>}
                                <span className="text-xs font-black max-w-[120px] truncate">{user.displayName || 'Guest'}</span>
                                <button onClick={()=>signOut(auth)} className="text-slate-300 hover:text-red-500 ml-2 transition-colors"><i data-lucide="log-out" className="w-4 h-4"></i></button>
                            </div>
                        </div>
                    </header>

                    {/* Stats Dashboard */}
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-6 mb-16">
                        {[{l:"Projects",v:stats.totalProjects,i:"package",c:"text-blue-500"}, {l:"Views",v:stats.totalViews,i:"eye",c:"text-emerald-500"}, {l:"Clicks",v:stats.totalClicks,i:"mouse-pointer-2",c:"text-purple-500"}, {l:t.my,v:projects.filter(p=>p.creatorId===user.uid).length,i:"medal",c:"text-amber-500",a:true}].map((s, i) => (
                            <div key={i} className={`p-8 rounded-[3rem] ${s.a ? 'gradient-primary text-white shadow-2xl shadow-indigo-100' : 'glass-panel bg-white/50 border-white'} transition-all`}>
                                <div className={`text-[10px] font-black uppercase tracking-widest mb-3 ${s.a ? 'text-white/60' : 'text-slate-400'}`}>{s.l}</div>
                                <div className="text-4xl font-black flex items-center gap-3">{s.v || 0} <i data-lucide={s.i} className={`w-5 h-5 ${s.a ? 'text-white/30' : 'opacity-20'}`}></i></div>
                            </div>
                        ))}
                    </div>

                    {/* Advanced Filters */}
                    <div className="flex flex-wrap gap-4 mb-16 overflow-x-auto hide-scrollbar pb-2">
                        <div className="glass-panel p-1.5 rounded-2xl flex gap-1 whitespace-nowrap bg-white/40">
                            {['All', ...SUBJECTS.slice(0, 5)].map(s => (
                                <button key={s} onClick={()=>setFilters({...filters, subject:s})} className={`px-6 py-3 rounded-xl text-xs font-black transition-all ${filters.subject===s?'bg-white shadow-md text-indigo-600':'text-slate-400 hover:text-slate-600'}`}>{s==='All'?'全部':s}</button>
                            ))}
                        </div>
                        <select onChange={e=>setFilters({...filters, year:e.target.value})} className="px-8 py-4 rounded-2xl glass-panel bg-white font-black text-xs outline-none focus:ring-2 ring-indigo-500 min-w-[160px]">{YEARS.map(y=><option key={y} value={y}>{y}</option>)}<option value="All">所有年级</option></select>
                        <select onChange={e=>setFilters({...filters, type:e.target.value})} className="px-8 py-4 rounded-2xl glass-panel bg-white font-black text-xs outline-none focus:ring-2 ring-indigo-500 min-w-[160px]">{TYPES.map(t=><option key={t} value={t}>{t}</option>)}<option value="All">所有种类</option></select>
                    </div>

                    {/* Bento Gallery Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
                        {loading ? <div className="col-span-full py-40 text-center font-black tracking-[0.4em] text-slate-200 animate-pulse">CONNECTING TO FIREBASE...</div> : 
                        filtered.length === 0 ? <div className="col-span-full py-40 text-center glass-panel rounded-[4rem] text-slate-300 font-black tracking-widest">{t.noData}</div> : 
                        filtered.map(p => {
                            const v = getVisualSet(p.name, p.subject);
                            const voted = p.votedUsers?.includes(user.uid);
                            return (
                                <div key={p.id} className={`bento-card glass-panel rounded-[3.5rem] p-10 flex flex-col group relative overflow-visible ${v.l}/20 border-white`}>
                                    {/* Star Rating Integration */}
                                    <div className="absolute -top-4 -right-4 glass-panel bg-white rounded-3xl p-3 shadow-xl flex flex-col items-center gap-1 z-10">
                                        <div className="flex gap-0.5">
                                            {[1,2,3,4,5].map(star => (
                                                <button key={star} disabled={voted} onClick={async ()=>{
                                                    const score = ((p.stars*p.ratingCount)+star)/(p.ratingCount+1);
                                                    await updateDoc(doc(db,'artifacts',currentAppId,'public','data','projects',p.id),{stars:Number(score.toFixed(1)),ratingCount:increment(1),votedUsers:arrayUnion(user.uid)});
                                                }} className={`transition-all ${voted ? 'cursor-default' : 'hover:scale-150'}`}>
                                                    <i data-lucide="star" className={`w-5 h-5 ${star<=Math.floor(p.stars)?'star-active fill-current':'star-inactive'} ${!voted && 'hover:star-active'}`}></i>
                                                </button>
                                            ))}
                                        </div>
                                        <span className="text-[10px] font-black text-slate-400 uppercase tracking-tighter">{p.stars || 0} / 5.0</span>
                                    </div>

                                    {/* Card Content */}
                                    <div className="flex justify-between items-start mb-8">
                                        <div className={`${v.c} p-6 rounded-[2rem] text-white shadow-2xl shadow-indigo-100 group-hover:rotate-6 transition-transform`}><i data-lucide={v.i} className="w-10 h-10"></i></div>
                                    </div>

                                    <div className="mb-10">
                                        <div className="flex gap-2 mb-4">
                                            <span className={`px-4 py-1.5 rounded-full text-[10px] font-black uppercase bg-white border border-slate-100 ${v.t}`}>#{p.subject}</span>
                                            <span className="px-4 py-1.5 rounded-full text-[10px] font-black uppercase bg-white text-slate-400">#{p.year}</span>
                                        </div>
                                        <h3 className="text-2xl font-extrabold text-slate-800 line-clamp-2 group-hover:text-indigo-600 transition-colors mb-3 leading-tight">{p.name}</h3>
                                        <p className="text-slate-400 text-[10px] font-medium truncate opacity-60 italic">{p.link}</p>
                                    </div>

                                    {/* Action Footer */}
                                    <div className="mt-auto pt-8 border-t border-white/60 flex items-center justify-between">
                                        <div className="flex items-center gap-3">
                                            {p.creatorPhoto ? <img src={p.creatorPhoto} className="w-12 h-12 rounded-2xl border-4 border-white shadow-lg" /> : <div className="w-12 h-12 bg-slate-100 rounded-2xl flex items-center justify-center text-slate-300"><i data-lucide="user" className="w-6 h-6"></i></div>}
                                            <div className="flex flex-col"><span className="text-[9px] font-black text-slate-300 uppercase tracking-widest leading-none">Curated By</span><span className="text-sm font-black text-slate-700 truncate max-w-[110px]">{p.creatorName}</span></div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            {isAdmin && (
                                                <div className="flex gap-2 mr-2">
                                                    <button onClick={()=>{setForm(p); setModal('edit');}} className="p-3 bg-white/90 text-slate-400 hover:text-indigo-600 rounded-2xl shadow-sm border border-white transition-all"><i data-lucide="edit-3" className="w-5 h-5"></i></button>
                                                    <button onClick={async ()=>{if(confirm(t.del)){await deleteDoc(doc(db,'artifacts',currentAppId,'public','data','projects',p.id));await updateDoc(doc(db,'artifacts',currentAppId,'public','data','stats','global'),{totalProjects:increment(-1)});}}} className="p-3 bg-white/90 text-slate-400 hover:text-rose-500 rounded-2xl shadow-sm border border-white transition-all"><i data-lucide="trash-2" className="w-5 h-5"></i></button>
                                                </div>
                                            )}
                                            <a href={p.link} target="_blank" onClick={()=>updateDoc(doc(db,'artifacts',currentAppId,'public','data','projects',p.id),{clicks:increment(1)})} className="p-6 bg-slate-900 text-white rounded-[2rem] hover:bg-indigo-600 transition-all shadow-2xl hover:scale-110 active:scale-95"><i data-lucide="play" className="w-7 h-7 fill-current"></i></a>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <footer className="mt-40 py-20 border-t border-slate-200 text-center text-[12px] font-black text-slate-300 uppercase tracking-[0.6em]">LDP Gemini SJK (C) KUO KUANG 2</footer>

                    {/* Edit/Create Modal */}
                    {modal && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-2xl z-[100] flex items-center justify-center p-6">
                            <div className="bg-white w-full max-w-xl rounded-[4rem] shadow-2xl overflow-hidden animate-in zoom-in duration-300 border-t-8 border-indigo-600">
                                <div className="p-12 text-left">
                                    <h3 className="text-4xl font-black mb-2 text-slate-900">{modal==='edit'?t.edit:t.pub}</h3>
                                    <p className="text-slate-400 font-bold text-xs uppercase tracking-[0.2em]">KSSR / KSSR SEMAKAN AI RESOURCE</p>
                                </div>
                                <form onSubmit={handleSave} className="px-12 pb-12 space-y-8 text-left">
                                    <div className="space-y-6">
                                        <div><label className="text-[10px] font-black text-slate-300 uppercase mb-3 block tracking-widest">Project Name / 作品名称</label><input required value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="w-full px-8 py-5 rounded-[1.5rem] bg-slate-50 border-none font-bold outline-none focus:ring-4 ring-indigo-500/10 transition-all" placeholder="e.g. 一年级数学乘法游戏" /></div>
                                        <div><label className="text-[10px] font-black text-slate-300 uppercase mb-3 block tracking-widest">GitHub Pages URL / 链接</label><input required type="url" value={form.link} onChange={e=>setForm({...form,link:e.target.value})} className="w-full px-8 py-5 rounded-[1.5rem] bg-slate-50 border-none font-bold outline-none focus:ring-4 ring-indigo-500/10 transition-all" placeholder="https://yquan77.github.io/..." /></div>
                                        <div className="grid grid-cols-3 gap-4">
                                            {[{l:"Subject",k:"subject",o:SUBJECTS},{l:"Year",k:"year",o:YEARS},{l:"Type",k:"type",o:TYPES}].map(f=>(
                                                <div key={f.k}><label className="text-[10px] font-black text-slate-300 uppercase mb-3 block">{f.l}</label><select value={form[f.k]} onChange={e=>setForm({...form,[f.k]:e.target.value})} className="w-full p-4 rounded-2xl bg-slate-50 border-none font-bold text-xs appearance-none">{f.o.map(opt=><option key={opt}>{opt}</option>)}</select></div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="flex gap-6 pt-6"><button type="button" onClick={()=>setModal(null)} className="flex-1 py-5 text-slate-400 font-black uppercase text-xs tracking-widest hover:text-slate-600">{t.cancel}</button><button type="submit" className="flex-[2] py-6 gradient-primary text-white rounded-[2.5rem] font-black shadow-2xl shadow-indigo-200 hover:scale-[1.03] transition-all tracking-widest">{t.save.toUpperCase()}</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
