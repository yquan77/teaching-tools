<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDP Gemini SJK (C) KUO KUANG 2 | Resource Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #f5f3ff 100%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .bento-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bento-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }
        .gradient-bg {
            background: linear-gradient(120deg, #6366f1, #a855f7);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-900 min-h-screen relative overflow-x-hidden">
    <!-- Decorative background blobs -->
    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-200/30 rounded-full blur-[120px] -z-10"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-200/30 rounded-full blur-[120px] -z-10"></div>

    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, getDoc, setDoc, increment, query, where, arrayUnion } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBezpJ9_6vPH7oUQyouhy1EoJNiXvciC0o",
            authDomain: "ldp-portal-8b38f.firebaseapp.com",
            projectId: "ldp-portal-8b38f",
            storageBucket: "ldp-portal-8b38f.firebasestorage.app",
            messagingSenderId: "378526911975",
            appId: "1:378526911975:web:2b14ea6ca18fefd6f34142",
            measurementId: "G-QR638Q5SBJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const appId = 'ldp-kuo-kuang-2';

        window.fb = { 
            auth, db, appId, collection, onSnapshot, doc, updateDoc, addDoc, 
            getDoc, setDoc, increment, signInAnonymously, onAuthStateChanged, 
            signInWithPopup, provider, signOut, query, where, arrayUnion 
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { auth, db, appId, collection, onSnapshot, doc, updateDoc, addDoc, getDoc, setDoc, increment, signInAnonymously, onAuthStateChanged, signInWithPopup, provider, signOut, query, where, arrayUnion } = window.fb;

        const SUBJECTS = ["Matematik", "Sains", "Bahasa Melayu", "Bahasa Cina", "Bahasa Inggeris", "RBT", "Sejarah", "Pend. Islam", "Pend. Moral", "PSV", "Muzik", "PJ & PK"];
        const YEARS = ["Tahun 1", "Tahun 2", "Tahun 3", "Tahun 4", "Tahun 5", "Tahun 6"];
        const TYPES = ["Latihan", "Pengajaran", "Permainan", "Alatan/Tools"];

        const App = () => {
            const [lang, setLang] = useState('zh');
            const [user, setUser] = useState(null);
            const [isCheckingAuth, setIsCheckingAuth] = useState(true);
            const [projects, setProjects] = useState([]);
            const [globalStats, setGlobalStats] = useState({ totalViews: 0, totalClicks: 0, totalProjects: 0 });
            const [loading, setLoading] = useState(true);
            const [showModal, setShowModal] = useState(false);
            const [filter, setFilter] = useState({ subject: 'All', year: 'All', type: 'All' });
            const [form, setForm] = useState({ name: '', link: '', subject: 'Matematik', year: 'Tahun 1', type: 'Permainan' });

            const t = {
                zh: {
                    welcome: "欢迎来到 AI 教学资源中心",
                    subwelcome: "SJK (C) KUO KUANG 2",
                    loginGoogle: "Google 账号登录",
                    guestEntry: "以访客身份进入",
                    tagline: "让您的 AI 创意被看见，让教学更轻松",
                    langSwitch: "Bahasa Melayu",
                    dashboard: {
                        projects: "作品总量",
                        views: "总访问量",
                        clicks: "点击使用",
                        my: "我的贡献"
                    },
                    filter: {
                        allSub: "全部科目",
                        allYear: "全部年级",
                        allType: "全部种类"
                    },
                    btnPublish: "发布作品",
                    btnLogout: "登出",
                    statusSubmitted: "已发布",
                    btnPlay: "试用作品",
                    noData: "暂无作品，切换分类试试",
                    modal: {
                        title: "发布您的 AI 作品",
                        sub: "请填写作品详情以便存档与分类",
                        name: "作品名称",
                        link: "GitHub Pages 链接",
                        subLabel: "科目",
                        yearLabel: "年级",
                        typeLabel: "种类",
                        cancel: "取消",
                        confirm: "立即发布"
                    }
                },
                ms: {
                    welcome: "Pusat Sumber AI",
                    subwelcome: "SJK (C) KUO KUANG 2",
                    loginGoogle: "Log Masuk Google",
                    guestEntry: "Masuk sebagai Tetamu",
                    tagline: "Kongsi kreativiti AI anda untuk pengajaran yang lebih mudah",
                    langSwitch: "中文界面",
                    dashboard: {
                        projects: "Jumlah Karya",
                        views: "Jumlah Lawatan",
                        clicks: "Klik Guna",
                        my: "Sumbangan Saya"
                    },
                    filter: {
                        allSub: "Semua Subjek",
                        allYear: "Semua Tahun",
                        allType: "Semua Kategori"
                    },
                    btnPublish: "Hantar Karya",
                    btnLogout: "Log Keluar",
                    statusSubmitted: "Telah Hantar",
                    btnPlay: "Cuba Guna",
                    noData: "Tiada karya ditemui bagi kategori ini",
                    modal: {
                        title: "Hantar Karya AI Anda",
                        sub: "Sila lengkapkan butiran karya untuk arkib",
                        name: "Nama Karya",
                        link: "Pautan GitHub Pages",
                        subLabel: "Subjek",
                        yearLabel: "Tahun",
                        typeLabel: "Kategori",
                        cancel: "Batal",
                        confirm: "Hantar Sekarang"
                    }
                }
            }[lang];

            useEffect(() => {
                const unsubAuth = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setIsCheckingAuth(false);
                });
                return () => unsubAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                
                const updateVisitStats = async () => {
                    const statDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'global');
                    await setDoc(statDocRef, { totalViews: increment(1) }, { merge: true });
                };
                updateVisitStats();

                const projectsCol = collection(db, 'artifacts', appId, 'public', 'data', 'projects');
                const unsubProjects = onSnapshot(projectsCol, (snapshot) => {
                    const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                    setProjects(list);
                    setLoading(false);
                });

                const statDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'global');
                const unsubStats = onSnapshot(statDocRef, (d) => {
                    if (d.exists()) setGlobalStats(d.data());
                });

                return () => { unsubProjects(); unsubStats(); };
            }, [user]);

            useEffect(() => {
                lucide.createIcons();
            }, [user, projects, loading, showModal, lang]);

            const loginWithGoogle = () => signInWithPopup(auth, provider);
            const loginAsGuest = () => signInAnonymously(auth);
            const logout = () => signOut(auth);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (user.isAnonymous) return; 
                
                try {
                    const projectsCol = collection(db, 'artifacts', appId, 'public', 'data', 'projects');
                    await addDoc(projectsCol, {
                        ...form,
                        creatorId: user.uid,
                        creatorName: user.displayName || 'Teacher',
                        creatorPhoto: user.photoURL || null,
                        timestamp: Date.now(),
                        views: 0,
                        clicks: 0,
                        stars: 0,
                        ratingCount: 0,
                        votedUsers: []
                    });
                    
                    const statDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'global');
                    await updateDoc(statDocRef, { totalProjects: increment(1) });
                    
                    setShowModal(false);
                } catch (e) { console.error(e); }
            };

            const trackClick = async (id) => {
                const pDoc = doc(db, 'artifacts', appId, 'public', 'data', 'projects', id);
                const sDoc = doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'global');
                await updateDoc(pDoc, { clicks: increment(1) });
                await updateDoc(sDoc, { totalClicks: increment(1) });
            };

            const handleRate = async (id, currentRating, currentCount, votedUsers = [], newStar) => {
                if (votedUsers.includes(user.uid)) return; 

                const pDoc = doc(db, 'artifacts', appId, 'public', 'data', 'projects', id);
                const newScore = ((currentRating * currentCount) + newStar) / (currentCount + 1);
                await updateDoc(pDoc, { 
                    stars: Number(newScore.toFixed(1)), 
                    ratingCount: increment(1),
                    votedUsers: arrayUnion(user.uid)
                });
            };

            const filteredProjects = useMemo(() => {
                return projects.filter(p => {
                    const matchSub = filter.subject === 'All' || p.subject === filter.subject;
                    const matchYear = filter.year === 'All' || p.year === filter.year;
                    const matchType = filter.type === 'All' || p.type === filter.type;
                    return matchSub && matchYear && matchType;
                });
            }, [projects, filter]);

            if (isCheckingAuth) return null;

            // --- Landing / Login Logic ---
            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="glass max-w-lg w-full p-10 rounded-[3rem] text-center shadow-2xl border-white/50 relative overflow-hidden">
                            {/* Language Switcher for Landing Page */}
                            <div className="absolute top-6 right-8">
                                <button 
                                    onClick={() => setLang(lang === 'zh' ? 'ms' : 'zh')}
                                    className="flex items-center gap-2 text-xs font-bold text-indigo-600 hover:text-indigo-800 transition-colors"
                                >
                                    <i data-lucide="languages" className="w-4 h-4"></i>
                                    {t.langSwitch}
                                </button>
                            </div>

                            <div className="gradient-bg w-20 h-20 rounded-3xl mx-auto mb-8 flex items-center justify-center text-white shadow-xl rotate-3">
                                <i data-lucide="sparkles" className="w-10 h-10"></i>
                            </div>
                            <h1 className="text-3xl font-extrabold text-slate-900 mb-2">{t.welcome}</h1>
                            <p className="text-slate-500 mb-10 font-medium">{t.subwelcome}</p>
                            
                            <div className="space-y-4">
                                <button onClick={loginWithGoogle} className="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-indigo-600 transition-all shadow-lg">
                                    <img src="https://www.google.com/favicon.ico" className="w-5 h-5 brightness-200" /> {t.loginGoogle}
                                </button>
                                <button onClick={loginAsGuest} className="w-full py-4 bg-white text-slate-600 border border-slate-200 rounded-2xl font-bold hover:bg-slate-50 transition-all">
                                    {t.guestEntry}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-7xl mx-auto px-6 py-8 animate-in fade-in duration-500">
                    {/* Navbar */}
                    <header className="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-12">
                        <div className="flex items-center gap-4">
                            <div className="gradient-bg p-2 rounded-xl text-white shadow-lg">
                                <i data-lucide="gem" className="w-6 h-6"></i>
                            </div>
                            <div>
                                <h1 className="text-2xl font-black text-slate-900 tracking-tight">Gemini Hub</h1>
                                <p className="text-slate-400 text-xs font-bold uppercase tracking-widest">{t.tagline}</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-3">
                            <button 
                                onClick={() => setLang(lang === 'zh' ? 'ms' : 'zh')}
                                className="glass px-4 py-2 rounded-full text-xs font-bold text-indigo-600 flex items-center gap-2 hover:bg-white transition-all"
                            >
                                <i data-lucide="languages" className="w-4 h-4"></i>
                                {t.langSwitch}
                            </button>

                            {!user.isAnonymous ? (
                                <div className="flex items-center gap-3 glass p-1.5 pr-4 rounded-full border-white/40">
                                    {user.photoURL && <img src={user.photoURL} className="w-8 h-8 rounded-full border-2 border-white" alt="profile" />}
                                    <span className="text-xs font-bold truncate max-w-[100px]">{user.displayName}</span>
                                    <button onClick={logout} className="text-slate-300 hover:text-red-500 transition-colors"><i data-lucide="log-out" className="w-4 h-4"></i></button>
                                </div>
                            ) : (
                                <div className="flex items-center gap-2 text-slate-400 text-xs font-bold px-3 py-2">
                                    <i data-lucide="user-x" className="w-4 h-4"></i> Guest
                                    <button onClick={logout} className="ml-2 text-indigo-600">Login</button>
                                </div>
                            )}
                            
                            {!user.isAnonymous && (
                                <button onClick={() => setShowModal(true)} className="px-6 py-3 gradient-bg text-white font-extrabold rounded-2xl shadow-lg hover:opacity-90 transition-all flex items-center gap-2 text-sm">
                                    <i data-lucide="plus" className="w-4 h-4"></i> {t.btnPublish}
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Stats Dashboard */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
                        {[
                            { label: t.dashboard.projects, val: globalStats.totalProjects || 0, icon: "package", color: "text-blue-500" },
                            { label: t.dashboard.views, val: globalStats.totalViews || 0, icon: "eye", color: "text-emerald-500" },
                            { label: t.dashboard.clicks, val: globalStats.totalClicks || 0, icon: "mouse-pointer-2", color: "text-purple-500" },
                            { label: t.dashboard.my, val: projects.filter(p => p.creatorId === user.uid).length, icon: "medal", color: "text-amber-500", bg: "gradient-bg text-white" }
                        ].map((s, idx) => (
                            <div key={idx} className={`${s.bg || 'glass'} p-6 rounded-[2.5rem] transition-all`}>
                                <div className={`${s.bg ? 'text-white/70' : 'text-slate-400'} text-[10px] font-black uppercase tracking-[0.2em] mb-2`}>{s.label}</div>
                                <div className="text-3xl font-black flex items-baseline gap-2">
                                    {s.val}
                                    <span className={`${s.bg ? 'text-white/50' : s.color} text-sm`}><i data-lucide={s.icon} className="w-4 h-4"></i></span>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Gallery Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        {loading ? (
                            <div className="col-span-full py-32 text-center text-slate-300 animate-pulse font-bold tracking-widest">LOADING DATABASE...</div>
                        ) : filteredProjects.length === 0 ? (
                            <div className="col-span-full py-32 text-center glass rounded-[3rem] border-dashed border-2 text-slate-300 font-bold uppercase tracking-widest">{t.noData}</div>
                        ) : (
                            filteredProjects.map((p) => {
                                const hasVoted = p.votedUsers?.includes(user.uid);
                                return (
                                    <div key={p.id} className="bento-card group glass rounded-[2.5rem] p-8 flex flex-col shadow-sm">
                                        <div className="flex justify-between items-start mb-6">
                                            <div className="flex gap-2 flex-wrap">
                                                <span className="px-3 py-1 bg-white text-indigo-500 text-[10px] font-black rounded-lg shadow-sm">#{p.subject}</span>
                                                <span className="px-3 py-1 bg-white text-slate-400 text-[10px] font-black rounded-lg shadow-sm">#{p.year}</span>
                                            </div>
                                            <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-black ${hasVoted ? 'bg-amber-100 text-amber-600' : 'bg-slate-50 text-slate-400'}`}>
                                                <i data-lucide="star" className={`w-3.5 h-3.5 ${hasVoted ? 'fill-current' : ''}`}></i>
                                                {p.stars || '0'}
                                            </div>
                                        </div>
                                        
                                        <h3 className="text-xl font-black text-slate-800 mb-2 leading-tight group-hover:text-indigo-600 transition-colors line-clamp-1">{p.name}</h3>
                                        <p className="text-slate-400 text-xs font-medium mb-8 truncate">{p.link}</p>
                                        
                                        <div className="flex items-center justify-between mt-auto pt-6 border-t border-white/50">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 bg-white rounded-2xl flex items-center justify-center overflow-hidden shadow-sm border border-slate-100">
                                                    {p.creatorPhoto ? <img src={p.creatorPhoto} alt="creator" /> : <i data-lucide="user" className="w-5 h-5 text-slate-200"></i>}
                                                </div>
                                                <div className="flex flex-col">
                                                    <span className="text-[10px] font-black text-slate-300 uppercase tracking-tighter">Created By</span>
                                                    <span className="text-xs font-bold text-slate-700 truncate max-w-[100px]">{p.creatorName}</span>
                                                </div>
                                            </div>
                                            <a 
                                                href={p.link} 
                                                target="_blank" 
                                                onClick={() => trackClick(p.id)}
                                                className="p-4 bg-slate-900 text-white rounded-2xl hover:bg-indigo-600 transition-all shadow-xl active:scale-95"
                                            >
                                                <i data-lucide="play" className="w-5 h-5 fill-current"></i>
                                            </a>
                                        </div>
                                        
                                        {/* Voting Interaction */}
                                        <div className="mt-6 flex items-center justify-between px-2">
                                            <div className="flex gap-1.5">
                                                {[1,2,3,4,5].map(s => (
                                                    <button 
                                                        key={s} 
                                                        disabled={hasVoted}
                                                        onClick={() => handleRate(p.id, p.stars || 0, p.ratingCount || 0, p.votedUsers, s)} 
                                                        className={`transition-all ${hasVoted ? 'cursor-not-allowed text-slate-200' : 'text-slate-200 hover:text-amber-400 hover:scale-125'}`}
                                                    >
                                                        <i data-lucide="star" className={`w-5 h-5 ${hasVoted && s <= Math.floor(p.stars) ? 'text-amber-300 fill-current' : ''}`}></i>
                                                    </button>
                                                ))}
                                            </div>
                                            <div className="text-[10px] font-black text-slate-300 flex items-center gap-1">
                                                <i data-lucide="mouse-pointer-click" className="w-3 h-3"></i> {p.clicks || 0}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>

                    <footer className="mt-24 py-12 border-t border-slate-200 text-center flex flex-col items-center gap-4">
                        <div className="w-12 h-1 bg-indigo-600 rounded-full mb-2"></div>
                        <p className="text-slate-400 text-[11px] font-black uppercase tracking-[0.3em]">
                            LDP Gemini SJK (C) KUO KUANG 2
                        </p>
                    </footer>

                    {/* Submit Modal */}
                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-[100] flex items-center justify-center p-6">
                            <div className="bg-white w-full max-w-xl rounded-[3rem] shadow-2xl overflow-hidden animate-in zoom-in duration-300">
                                <div className="p-10 gradient-bg text-white relative">
                                    <div className="absolute top-[-20%] right-[-10%] w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
                                    <h3 className="text-3xl font-black mb-2 leading-tight">{t.modal.title}</h3>
                                    <p className="text-indigo-100 font-medium">{t.modal.sub}</p>
                                </div>
                                <form onSubmit={handleSubmit} className="p-10 space-y-6 text-left">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="col-span-full">
                                            <label className="block text-[10px] font-black text-slate-300 uppercase mb-2 tracking-widest">{t.modal.name}</label>
                                            <input required value={form.name} onChange={e => setForm({...form, name: e.target.value})} type="text" placeholder="e.g. Space Math Challenge" className="w-full px-5 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 ring-indigo-500 outline-none font-bold" />
                                        </div>
                                        <div className="col-span-full">
                                            <label className="block text-[10px] font-black text-slate-300 uppercase mb-2 tracking-widest">{t.modal.link}</label>
                                            <input required value={form.link} onChange={e => setForm({...form, link: e.target.value})} type="url" placeholder="https://..." className="w-full px-5 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 ring-indigo-500 outline-none font-bold" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-black text-slate-300 uppercase mb-2 tracking-widest">{t.modal.subLabel}</label>
                                            <select value={form.subject} onChange={e => setForm({...form, subject: e.target.value})} className="w-full px-5 py-4 rounded-2xl bg-slate-50 border-none outline-none font-bold">
                                                {SUBJECTS.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-black text-slate-300 uppercase mb-2 tracking-widest">{t.modal.yearLabel}</label>
                                            <select value={form.year} onChange={e => setForm({...form, year: e.target.value})} className="w-full px-5 py-4 rounded-2xl bg-slate-50 border-none outline-none font-bold">
                                                {YEARS.map(y => <option key={y} value={y}>{y}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="flex gap-4 pt-6">
                                        <button type="button" onClick={() => setShowModal(false)} className="flex-1 py-4 text-slate-400 font-bold hover:text-slate-600">{t.modal.cancel}</button>
                                        <button type="submit" className="flex-[2] py-4 gradient-bg text-white rounded-2xl font-black shadow-xl hover:opacity-90">{t.modal.confirm}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
