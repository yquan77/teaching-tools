<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDP Gemini SJK (C) KUO KUANG 2 | Portal 1.0</title>
    <!-- 基础资源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 动画资源 GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <!-- React 核心 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fdfdff; overflow-x: hidden; }
        .mesh-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.12) 0px, transparent 50%),
                        radial-gradient(at 100% 0%, rgba(147, 51, 234, 0.12) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.12) 0px, transparent 50%),
                        radial-gradient(at 0% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
        }
        .bento-card { transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1); cursor: pointer; border-radius: 2rem; }
        .bento-card:hover { transform: translateY(-8px); border-color: #6366f1; box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.1); }
        .modal-blur { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); background: rgba(15, 23, 42, 0.5); }
        .star-active { fill: #f59e0b; color: #f59e0b; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .purple-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        
        /* GSAP Horizontal Scroll Styles */
        .horiz-gallery-wrapper { display: flex; flex-wrap: nowrap; will-change: transform; }
        .moment-item { flex: 0 0 350px; padding-right: 1.5rem; transition: transform 0.3s ease; cursor: zoom-in; }
        .moment-item:hover { transform: scale(1.02); }
        @media (max-width: 768px) { .moment-item { flex: 0 0 280px; } }
    </style>
</head>
<body class="text-slate-900 min-h-screen">
    <div class="mesh-bg"></div>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, setDoc, deleteDoc, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBezpJ9_6vPH7oUQyouhy1EoJNiXvciC0o",
            authDomain: "ldp-portal-8b38f.firebaseapp.com",
            projectId: "ldp-portal-8b38f",
            storageBucket: "ldp-portal-8b38f.firebasestorage.app",
            messagingSenderId: "378526911975",
            appId: "1:378526911975:web:2b14ea6ca18fefd6f34142",
            measurementId: "G-QR638Q5SBJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const currentAppId = 'ldp-kuo-kuang-2'; 

        window.fb = { auth, db, currentAppId, collection, onSnapshot, doc, updateDoc, addDoc, setDoc, deleteDoc, increment, signInAnonymously, onAuthStateChanged, signInWithPopup, provider, signOut, arrayUnion };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { auth, db, currentAppId, collection, onSnapshot, doc, updateDoc, addDoc, setDoc, deleteDoc, increment, signInAnonymously, onAuthStateChanged, signInWithPopup, provider, signOut, arrayUnion } = window.fb;

        gsap.registerPlugin(ScrollTrigger);

        const ADMIN_EMAILS = ["yquan77@gmail.com", "yquan77@moe-dl.edu.my"];

        const LANGUAGES = {
            zh: {
                subjects: ["数学", "科学", "国语", "华语", "英语", "设计与工艺", "历史", "伊斯兰教育", "道德教育", "美术", "音乐", "体健"],
                years: ["一年级", "二年级", "三年级", "四年级", "五年级", "六年级"],
                types: ["练习", "教学", "游戏", "工具"],
                all: "全部",
                stats: ["累计作品", "访客总量", "使用总量", "我的贡献"],
                ui: {
                    h1: "AI 教学资源库", tagline: "激发意念 • 创意教学", loginHint: "登录账号以发布您的作品与精彩照片",
                    btnLogin: "Google 账号登录", btnGuest: "以访客身份进入", logout: "登出", publish: "发布作品",
                    noData: "暂无相关资料", detail: "点击详情", score: "评分", plays: "次点击",
                    formName: "作品名称", formLink: "地址链接", formSub: "科目", formYear: "年级", formType: "种类",
                    confirm: "确认提交", cancel: "取消", close: "关闭窗口", master: "管理员模式", play: "开始体验",
                    welcomeBack: "欢迎回来!", moments: "精彩瞬间", uploadPhoto: "分享瞬间", uploading: "处理中...",
                    success: "操作成功！", error: "操作失败，请重试。"
                }
            },
            ms: {
                subjects: ["Matematik", "Sains", "Bahasa Melayu", "Bahasa Cina", "Bahasa Inggeris", "RBT", "Sejarah", "Pend. Islam", "Pend. Moral", "PSV", "Muzik", "PJ & PK"],
                years: ["Tahun 1", "Tahun 2", "Tahun 3", "Tahun 4", "Tahun 5", "Tahun 6"],
                types: ["Latihan", "Pengajaran", "Permainan", "Alatan"],
                all: "Semua",
                stats: ["Jumlah Karya", "Jumlah Pelawat", "Jumlah Penggunaan", "Sumbangan"],
                ui: {
                    h1: "Hab Sumber AI", tagline: "Vibe Coding • Tanpa Had", loginHint: "Log masuk untuk hantar karya & foto anda",
                    btnLogin: "Log Masuk Google", btnGuest: "Masuk Tetamu", logout: "Keluar", publish: "Hantar Karya",
                    noData: "Tiada Data", detail: "Butiran", score: "Skor", plays: "klik",
                    formName: "Nama Karya", formLink: "Pautan URL", formSub: "Subjek", formYear: "Tahun", formType: "Kategori",
                    confirm: "Hantar", cancel: "Batal", close: "Tutup", master: "Mode Admin", play: "Cuba Main",
                    welcomeBack: "Selamat Kembali!", moments: "Momen Indah", uploadPhoto: "Kongsi Foto", uploading: "Memproses...",
                    success: "Berjaya!", error: "Gagal, sila cuba lagi."
                }
            }
        };

        const getVisual = (name="", sub="") => {
            const s = (name + sub).toLowerCase();
            if (s.includes("数学") || s.includes("matematik")) return { i: "calculator", c: "bg-blue-600", l: "bg-blue-50", t: "text-blue-600" };
            if (s.includes("科学") || s.includes("sains")) return { i: "flask-conical", c: "bg-emerald-600", l: "bg-emerald-50", t: "text-emerald-600" };
            if (s.includes("游戏") || s.includes("game")) return { i: "gamepad-2", c: "bg-purple-600", l: "bg-purple-50", t: "text-purple-600" };
            if (s.includes("文") || s.includes("bahasa")) return { i: "book-open", c: "bg-orange-600", l: "bg-orange-50", t: "text-orange-600" };
            return { i: "sparkles", c: "bg-indigo-600", l: "bg-indigo-50", t: "text-indigo-600" };
        };

        const compressImg = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        const max = 1024;
                        if (w > h) { if (w > max) { h *= max / w; w = max; } }
                        else { if (h > max) { w *= max / h; h = max; } }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        };

        const App = () => {
            const [lang, setLang] = useState('zh');
            const [user, setUser] = useState(null);
            const [projects, setProjects] = useState([]);
            const [moments, setMoments] = useState([]);
            const [stats, setStats] = useState({ totalViews: 0, totalClicks: 0, totalProjects: 0 });
            const [loading, setLoading] = useState(true);
            const [modal, setModal] = useState(null); 
            const [selectedP, setSelectedP] = useState(null);
            const [viewPhoto, setViewPhoto] = useState(null);
            const [toast, setToast] = useState(null);
            const [isBusy, setIsBusy] = useState(false);
            const [form, setForm] = useState({ name: '', link: '', subject: '数学', year: '一年级', type: '游戏' });
            const [filters, setFilters] = useState({ subject: 'All', year: 'All', type: 'All' });
            
            const triggerRef = useRef(null);
            const galleryRef = useRef(null);
            const fileRef = useRef(null);

            const t = LANGUAGES[lang];
            const isAdmin = useMemo(() => user && ADMIN_EMAILS.includes(user.email), [user]);

            const notify = (m, type='success') => {
                setToast({ m, type });
                setTimeout(() => setToast(null), 3000);
            };

            useEffect(() => {
                const unsub = onAuthStateChanged(auth, u => { setUser(u); if(!u) setLoading(false); });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!user) return;
                const statRef = doc(db, 'artifacts', currentAppId, 'public', 'data', 'stats', 'global');
                setDoc(statRef, { totalViews: increment(1) }, { merge: true });

                const unsubP = onSnapshot(collection(db, 'artifacts', currentAppId, 'public', 'data', 'projects'), s => {
                    setProjects(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0)));
                    setLoading(false);
                });
                const unsubM = onSnapshot(collection(db, 'artifacts', currentAppId, 'public', 'data', 'moments'), s => {
                    setMoments(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0)));
                });
                const unsubS = onSnapshot(statRef, d => d.exists() && setStats(d.data()));
                return () => { unsubP(); unsubM(); unsubS(); };
            }, [user]);

            useEffect(() => {
                if (moments.length > 0 && !loading) {
                    const ctx = gsap.context(() => {
                        const width = galleryRef.current.scrollWidth;
                        const scrollDist = width - window.innerWidth + 100;
                        if (scrollDist > 0) {
                            gsap.to(galleryRef.current, {
                                x: -scrollDist,
                                ease: "none",
                                scrollTrigger: {
                                    trigger: triggerRef.current,
                                    pin: true,
                                    scrub: 1,
                                    start: "center center",
                                    end: () => `+=${width}`
                                }
                            });
                        }
                    }, triggerRef);
                    return () => ctx.revert();
                }
            }, [moments, loading]);

            useEffect(() => { lucide.createIcons(); }, [user, projects, moments, loading, modal, lang, selectedP, toast, isBusy, viewPhoto]);

            const handleSave = async (e) => {
                e.preventDefault();
                setIsBusy(true);
                try {
                    const col = collection(db, 'artifacts', currentAppId, 'public', 'data', 'projects');
                    if(modal === 'edit') await updateDoc(doc(db, 'artifacts', currentAppId, 'public', 'data', 'projects', form.id), form);
                    else {
                        await addDoc(col, { ...form, creatorId: user.uid, creatorName: user.displayName || 'Guru', creatorPhoto: user.photoURL || null, timestamp: Date.now(), views: 0, clicks: 0, stars: 0, ratingCount: 0, votedUsers: [] });
                        await updateDoc(doc(db, 'artifacts', currentAppId, 'public', 'data', 'stats', 'global'), { totalProjects: increment(1) });
                    }
                    setModal(null);
                    notify(t.ui.success);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } catch (e) { notify(t.ui.error, 'error'); }
                finally { setIsBusy(false); }
            };

            const handleUpload = async (e) => {
                const file = e.target.files[0];
                if (!file || user.isAnonymous) return;
                setIsBusy(true);
                try {
                    const data = await compressImg(file);
                    await addDoc(collection(db, 'artifacts', currentAppId, 'public', 'data', 'moments'), { image: data, uploader: user.displayName, uid: user.uid, timestamp: Date.now() });
                    notify(t.ui.success);
                } catch (err) { notify(t.ui.error, 'error'); }
                finally { setIsBusy(false); if(fileRef.current) fileRef.current.value=""; }
            };

            const handlePlayAction = async (p) => {
                const pRef = doc(db, 'artifacts', currentAppId, 'public', 'data', 'projects', p.id);
                const gRef = doc(db, 'artifacts', currentAppId, 'public', 'data', 'stats', 'global');
                await updateDoc(pRef, { clicks: increment(1) });
                await updateDoc(gRef, { totalClicks: increment(1) });
                window.open(p.link, '_blank');
            };

            const handleRate = async (p, val) => {
                if (p.votedUsers?.includes(user.uid)) return;
                const newStars = ((p.stars * p.ratingCount) + val) / (p.ratingCount + 1);
                const pRef = doc(db, 'artifacts', currentAppId, 'public', 'data', 'projects', p.id);
                await updateDoc(pRef, { stars: Number(newStars.toFixed(1)), ratingCount: increment(1), votedUsers: arrayUnion(user.uid) });
                setSelectedP(prev => ({...prev, stars: Number(newStars.toFixed(1)), ratingCount: (p.ratingCount + 1), votedUsers: [...(p.votedUsers||[]), user.uid]}));
            };

            const filtered = projects.filter(p => (filters.subject === 'All' || p.subject === filters.subject) || (lang === 'ms' && LANGUAGES.zh.subjects[LANGUAGES.ms.subjects.indexOf(p.subject)] === filters.subject));

            if (!user) return (
                <div className="min-h-screen flex items-center justify-center p-6 relative">
                    <div className="bg-white/80 backdrop-blur-xl max-w-md w-full p-12 rounded-[4rem] text-center shadow-2xl relative border border-white">
                        <button onClick={() => setLang(lang === 'zh' ? 'ms' : 'zh')} className="absolute top-8 right-10 text-[10px] font-black text-indigo-600 border border-indigo-100 px-4 py-1.5 rounded-full uppercase transition-all hover:bg-indigo-50">{lang==='zh'?'BAHASA MELAYU':'中文界面'}</button>
                        <div className="bg-indigo-600 w-20 h-20 rounded-3xl mx-auto mb-10 flex items-center justify-center text-white shadow-xl rotate-6"><i data-lucide="sparkles" className="w-10 h-10"></i></div>
                        <h1 className="text-3xl font-black mb-2 tracking-tight text-slate-900 uppercase leading-none">{t.ui.h1}</h1>
                        <p className="text-slate-400 font-bold mb-12 text-[10px] tracking-[0.2em] uppercase">{t.ui.tagline}</p>
                        <div className="space-y-4">
                            <button onClick={()=>signInWithPopup(auth, provider)} className="w-full py-5 bg-slate-900 text-white rounded-[2rem] font-black flex items-center justify-center gap-3 shadow-xl hover:bg-indigo-600 transition-all text-sm uppercase tracking-widest leading-none"><img src="https://www.google.com/favicon.ico" className="w-5 h-5 brightness-200" /> {t.ui.btnLogin}</button>
                            <button onClick={()=>signInAnonymously(auth)} className="w-full py-5 bg-white text-slate-600 border border-slate-200 rounded-[2rem] font-black text-sm uppercase tracking-widest transition-all hover:bg-slate-50 leading-none"> {t.ui.btnGuest} </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="max-w-7xl mx-auto px-6 py-10 relative">
                    {toast && (
                        <div className={`fixed top-8 left-1/2 -translate-x-1/2 z-[1000] px-10 py-5 rounded-[2rem] shadow-2xl flex items-center gap-4 animate-in fade-in slide-in-from-top-4 duration-500 ${toast.type === 'success' ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'}`}>
                            <i data-lucide="check-circle" className="w-6 h-6"></i><span className="font-extrabold text-sm uppercase tracking-widest">{toast.m}</span>
                        </div>
                    )}

                    <header className="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-12">
                        <div className="flex items-center gap-5">
                            <div className="bg-slate-900 p-3.5 rounded-2xl text-white shadow-xl rotate-3"><i data-lucide="gem" className="w-6 h-6"></i></div>
                            <div><h1 className="text-2xl font-black tracking-tighter text-slate-900 uppercase">Gemini Hub</h1><p className="text-slate-400 text-[9px] font-black uppercase tracking-[0.3em]">{t.ui.tagline}</p></div>
                        </div>
                        <div className="flex items-center gap-3">
                            <button onClick={() => setLang(lang === 'zh' ? 'ms' : 'zh')} className="bg-white border-2 border-slate-100 px-5 py-2.5 rounded-full text-[11px] font-black text-indigo-600 hover:bg-slate-50 transition-all uppercase tracking-tighter"><i data-lucide="languages" className="w-4 h-4 inline mr-2"></i> {lang === 'zh' ? 'BAHASA' : '中文'}</button>
                            {!user.isAnonymous && <button onClick={()=>setModal('create')} className="px-7 py-3 bg-indigo-600 text-white font-black rounded-2xl shadow-lg text-[11px] uppercase tracking-widest hover:scale-105 transition-all">{t.ui.publish}</button>}
                            <div className="flex items-center gap-2 bg-white p-1 pr-4 rounded-full border shadow-sm">
                                {user.photoURL ? <img src={user.photoURL} className="w-8 h-8 rounded-full shadow-sm" /> : <div className="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center"><i data-lucide="user" className="w-4 h-4 text-slate-400"></i></div>}
                                <span className="text-[10px] font-black truncate max-w-[80px] uppercase text-slate-600">{user.displayName || t.ui.guest}</span>
                                <button onClick={()=>signOut(auth)} className="text-slate-300 hover:text-red-500 ml-1"><i data-lucide="log-out" className="w-3.5 h-3.5"></i></button>
                            </div>
                        </div>
                    </header>

                    {user.isAnonymous && (
                        <div className="mb-14 purple-gradient rounded-[2.5rem] p-8 flex flex-col md:flex-row items-center justify-between gap-6 text-white shadow-2xl animate-in slide-in-from-top-4 duration-500">
                            <div className="flex items-center gap-6"><div className="bg-white/20 p-4 rounded-3xl backdrop-blur-md"><i data-lucide="user-plus" className="w-8 h-8"></i></div><div><h4 className="text-lg font-black uppercase tracking-tight">{lang==='zh'?'参与我们!':'Sertai Kami!'}</h4><p className="font-bold text-sm text-indigo-100">{t.ui.loginHint}</p></div></div>
                            <button onClick={()=>signInWithPopup(auth, provider)} className="bg-white text-indigo-600 px-10 py-4 rounded-2xl font-black text-xs uppercase tracking-[0.2em] shadow-lg hover:scale-105 transition-all">{t.ui.btnLogin}</button>
                        </div>
                    )}

                    {/* Enhanced Filter Bar */}
                    <div className="flex flex-wrap gap-3 mb-10 overflow-x-auto hide-scrollbar pb-2 items-center">
                        <div className="bg-slate-100/80 p-1.5 rounded-2xl flex gap-1 whitespace-nowrap border border-white shadow-sm mr-2">
                            <button onClick={()=>setFilters({...filters, subject:'All'})} className={`px-5 py-2.5 rounded-xl text-[10px] font-black uppercase transition-all ${filters.subject==='All'?'bg-white shadow text-indigo-600':'text-slate-400 hover:text-slate-600'}`}>{t.all}</button>
                            {t.subjects.map(s => <button key={s} onClick={()=>setFilters({...filters, subject:s})} className={`px-5 py-2.5 rounded-xl text-[10px] font-black uppercase transition-all ${filters.subject===s?'bg-white shadow text-indigo-600':'text-slate-400 hover:text-slate-600'}`}>{s}</button>)}
                        </div>
                        <div className="flex gap-2">
                            <select onChange={e=>setFilters({...filters, year:e.target.value})} className="px-6 py-2.5 rounded-2xl bg-white border border-slate-100 font-black text-[10px] uppercase outline-none min-w-[140px] shadow-sm">{t.years.map(y=><option key={y} value={y}>{y}</option>)}<option value="All">{t.ui.formYear} ({t.all})</option></select>
                            <select onChange={e=>setFilters({...filters, type:e.target.value})} className="px-6 py-2.5 rounded-2xl bg-white border border-slate-100 font-black text-[10px] uppercase outline-none min-w-[140px] shadow-sm">{t.types.map(y=><option key={y} value={y}>{y}</option>)}<option value="All">{t.ui.formType} ({t.all})</option></select>
                        </div>
                    </div>

                    {/* Works Grid */}
                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4 mb-24">
                        {loading ? <div className="col-span-full py-20 text-center font-black text-slate-300 tracking-[0.5em] animate-pulse">LOADING...</div> : 
                        filtered.length === 0 ? <div className="col-span-full py-40 text-center border-2 border-dashed border-slate-200 rounded-[3rem] text-slate-300 font-black uppercase tracking-widest">{t.ui.noData}</div> : 
                        filtered.map(p => {
                            const v = getVisual(p.name, p.subject);
                            return (
                                <div key={p.id} onClick={()=>{setSelectedP(p); setModal('detail');}} className="bento-card bg-white rounded-3xl p-5 flex flex-col border border-slate-100 relative group overflow-hidden shadow-sm">
                                    <div className="flex justify-between items-start mb-4">
                                        <div className={`${v.c} p-3 rounded-2xl text-white shadow-lg shadow-indigo-100 group-hover:rotate-6 transition-transform`}><i data-lucide={v.i} className="w-5 h-5"></i></div>
                                        <div className="flex items-center gap-1 text-[9px] font-black text-amber-500 bg-amber-50 px-1.5 py-0.5 rounded-md">
                                            <i data-lucide="star" className="w-2.5 h-2.5 fill-current"></i> {p.stars || 0}
                                        </div>
                                    </div>
                                    <div className="mb-2 text-left">
                                        <p className={`text-[8px] font-black uppercase mb-1 ${v.t}`}>#{p.subject}</p>
                                        <h3 className="text-xs font-extrabold text-slate-800 line-clamp-2 leading-tight group-hover:text-indigo-600 transition-colors h-8">{p.name}</h3>
                                    </div>
                                    <div className="mt-4 pt-3 border-t border-slate-50 flex items-center justify-between opacity-50 text-[8px] font-black uppercase tracking-tighter">
                                        <span className="truncate max-w-[50px]">{p.creatorName}</span>
                                        <span className="text-indigo-600 font-black">{t.ui.detail}</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* GSAP HORIZONTAL SCROLL GALLERY */}
                    <section ref={triggerRef} className="py-20 bg-slate-50/50 rounded-[4rem] mb-24 overflow-hidden border border-slate-200 shadow-inner">
                        <div className="max-w-7xl mx-auto px-10 mb-10 flex items-center justify-between">
                            <div className="text-left"><h2 className="text-4xl font-black tracking-tighter text-slate-900 uppercase">{t.ui.moments}</h2></div>
                            {!user.isAnonymous && (
                                <div className="relative">
                                    <input type="file" accept="image/*" className="hidden" ref={fileRef} onChange={handleUpload} />
                                    <button onClick={()=>fileRef.current.click()} disabled={isBusy} className="px-8 py-4 bg-slate-900 text-white rounded-full font-black text-xs uppercase tracking-widest shadow-xl hover:bg-indigo-600 transition-all flex items-center gap-3">
                                        {isBusy ? <div className="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></div> : <><i data-lucide="camera" className="w-4 h-4"></i> {t.ui.uploadPhoto}</>}
                                    </button>
                                </div>
                            )}
                        </div>
                        <div className="horiz-gallery-wrapper px-10" ref={galleryRef}>
                            {moments.length === 0 ? (
                                <div className="w-full py-12 text-center text-slate-300 font-bold uppercase tracking-widest text-xs">Waiting for classroom moments...</div>
                            ) : moments.map(m => (
                                <div key={m.id} onClick={() => setViewPhoto(m.image)} className="moment-item group relative">
                                    <div className="w-full aspect-[4/3] rounded-[3rem] overflow-hidden border-8 border-white shadow-xl bg-white">
                                        <img src={m.image} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" loading="lazy" />
                                    </div>
                                    {isAdmin && (
                                        <button onClick={async (e)=>{e.stopPropagation(); if(confirm("Del?")) await deleteDoc(doc(db,'artifacts',currentAppId,'public','data','moments',m.id))}} className="absolute top-6 right-10 p-3 bg-rose-500 text-white rounded-full shadow-lg opacity-0 group-hover:opacity-100 hover:scale-110 transition-all"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                    )}
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Accomplishment Wall */}
                    <section className="mt-20 pt-20 border-t border-slate-200">
                        <div className="bg-slate-900 text-white p-16 rounded-[4rem] w-full max-w-6xl mx-auto shadow-2xl relative overflow-hidden flex flex-col md:flex-row items-center justify-around gap-12 text-center">
                            <div className="absolute top-0 right-0 w-96 h-96 bg-indigo-500/10 rounded-full blur-[120px]"></div>
                            <div className="relative z-10"><p className="text-[11px] font-black uppercase tracking-[0.5em] text-white/30 mb-4 flex items-center justify-center gap-2 uppercase tracking-widest"><i data-lucide="box" className="w-3.5 h-3.5"></i> {t.stats[0]}</p><p className="text-6xl font-black tracking-tighter leading-none">{stats.totalProjects || 0}</p></div>
                            <div className="w-px h-20 bg-white/10 hidden md:block"></div>
                            <div className="relative z-10"><p className="text-[11px] font-black uppercase tracking-[0.5em] text-white/30 mb-4 flex items-center justify-center gap-2 uppercase tracking-widest"><i data-lucide="eye" className="w-3.5 h-3.5"></i> {t.stats[1]}</p><p className="text-6xl font-black tracking-tighter leading-none">{stats.totalViews || 0}</p></div>
                            <div className="w-px h-20 bg-white/10 hidden md:block"></div>
                            <div className="relative z-10"><p className="text-[11px] font-black uppercase tracking-[0.4em] text-indigo-400 mb-4 flex items-center justify-center gap-2 uppercase tracking-widest"><i data-lucide="activity" className="w-3.5 h-3.5"></i> {t.stats[2]}</p><p className="text-7xl font-black tracking-tighter leading-none text-white drop-shadow-2xl">{stats.totalClicks || 0}</p></div>
                        </div>
                        <footer className="mt-20 text-center text-[12px] font-black text-slate-300 uppercase tracking-[0.6em] pb-12">LDP Gemini SJK (C) KUO KUANG 2</footer>
                    </section>

                    {/* Full Photo View Modal */}
                    {viewPhoto && (
                        <div className="fixed inset-0 z-[1000] modal-blur flex items-center justify-center p-4 animate-in fade-in zoom-in duration-300" onClick={() => setViewPhoto(null)}>
                            <div className="max-w-5xl w-full relative">
                                <button className="absolute -top-12 right-0 p-3 bg-white/20 text-white rounded-full hover:bg-white/40"><i data-lucide="x" className="w-6 h-6"></i></button>
                                <img src={viewPhoto} className="w-full h-auto rounded-[3rem] shadow-2xl border-8 border-white bg-white" />
                            </div>
                        </div>
                    )}

                    {/* Project Detail Modal */}
                    {modal === 'detail' && selectedP && (
                        <div className="fixed inset-0 z-[500] modal-blur flex items-center justify-center p-6 animate-in fade-in duration-300" onClick={()=>setModal(null)}>
                            <div className="bg-white w-full max-w-lg rounded-[4rem] shadow-2xl overflow-hidden border-t-8 border-indigo-600" onClick={e=>e.stopPropagation()}>
                                <div className={`p-12 ${getVisual(selectedP.name, selectedP.subject).l} relative text-left`}>
                                    <button onClick={()=>setModal(null)} className="absolute top-8 right-10 bg-white/60 p-3 rounded-full shadow-sm hover:scale-110 transition-all"><i data-lucide="x" className="w-5 h-5"></i></button>
                                    <div className="flex gap-2 mb-6"><span className="px-4 py-1.5 bg-white text-indigo-600 rounded-full text-[10px] font-black uppercase">#{selectedP.subject}</span><span className="px-4 py-1.5 bg-white text-slate-400 rounded-full text-[10px] font-black uppercase">#{selectedP.year}</span></div>
                                    <h3 className="text-4xl font-black leading-tight mb-8 text-slate-900 tracking-tighter">{selectedP.name}</h3>
                                    <div className="flex items-center gap-4 text-left"><img src={selectedP.creatorPhoto || 'https://www.gravatar.com/avatar/0?d=mp'} className="w-16 h-16 rounded-2xl border-4 border-white shadow-md" /><div className="flex flex-col"><span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{t.ui.author}</span><span className="font-extrabold text-slate-800 text-xl">{selectedP.creatorName}</span></div>{isAdmin && <div className="ml-auto flex gap-2"><button onClick={()=>{setForm(selectedP); setModal('edit');}} className="p-3 bg-white text-slate-400 hover:text-indigo-600 rounded-2xl shadow-sm border border-slate-50 transition-all"><i data-lucide="edit" className="w-5 h-5"></i></button><button onClick={async ()=>{if(confirm("Del?")){await deleteDoc(doc(db,'artifacts',currentAppId,'public','data','projects',selectedP.id));await updateDoc(doc(db,'artifacts',currentAppId,'public','data','stats','global'),{totalProjects:increment(-1)}); setModal(null); notify(t.ui.success);}}} className="p-3 bg-white text-slate-400 hover:text-red-500 rounded-2xl shadow-sm border border-slate-50 transition-all"><i data-lucide="trash-2" className="w-5 h-5"></i></button></div>}</div>
                                </div>
                                <div className="p-12 space-y-8 text-left">
                                    <div className="flex justify-between items-center bg-slate-50 p-8 rounded-[3rem] border border-slate-100">
                                        <div className="flex flex-col items-center gap-3">
                                            <div className="flex gap-1">
                                                {[1,2,3,4,5].map(s => <button key={s} onClick={()=>handleRate(selectedP, s)} className="transition-all hover:scale-150"><i data-lucide="star" className={`w-8 h-8 ${s <= Math.floor(selectedP.stars) ? 'star-active fill-current' : 'text-slate-200'}`}></i></button>)}
                                            </div>
                                            <span className="text-[11px] font-black text-slate-400 uppercase tracking-widest">{t.ui.score}: {selectedP.stars || 0} ({selectedP.ratingCount || 0})</span>
                                        </div>
                                        <div className="text-center px-10 border-l-2 border-slate-200">
                                            <div className="text-5xl font-black text-slate-900 tracking-tighter">{selectedP.clicks || 0}</div>
                                            <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1 uppercase leading-none">{t.ui.plays}</div>
                                        </div>
                                    </div>
                                    <div className="flex gap-5">
                                        <button onClick={()=>setModal(null)} className="flex-1 py-5 text-slate-400 font-black uppercase text-[10px] tracking-widest leading-none">{t.ui.close}</button>
                                        <button onClick={()=>handlePlayAction(selectedP)} className="flex-[3] py-6 bg-slate-900 text-white rounded-[2.5rem] font-black shadow-2xl hover:bg-indigo-600 transition-all uppercase text-sm tracking-widest flex items-center justify-center gap-3 leading-none"><i data-lucide="play-circle" className="w-6 h-6 fill-current"></i> {t.ui.play}</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Create/Edit Project Modal */}
                    {(modal === 'create' || modal === 'edit') && (
                        <div className="fixed inset-0 z-[600] modal-blur flex items-center justify-center p-6 animate-in zoom-in duration-300">
                            <div className="bg-white w-full max-w-lg rounded-[4rem] shadow-2xl overflow-hidden border-t-8 border-slate-900">
                                <div className="p-12 text-left bg-slate-50"><h3 className="text-4xl font-black mb-1 text-slate-900 tracking-tighter">{modal==='edit' ? t.ui.edit : t.ui.publish}</h3><p className="text-slate-400 text-[10px] font-black uppercase tracking-[0.3em]">LDP Portal Submission</p></div>
                                <form onSubmit={handleSave} className="p-12 space-y-7 text-left">
                                    <div className="space-y-6">
                                        <div><label className="text-[10px] font-black text-slate-300 uppercase mb-3 block tracking-widest">{t.ui.formName}</label><input required value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="w-full px-8 py-5 rounded-3xl bg-slate-50 border-none font-extrabold outline-none focus:ring-4 ring-indigo-500/10" placeholder="e.g. Matematik" /></div>
                                        <div><label className="text-[10px] font-black text-slate-300 uppercase mb-3 block tracking-widest">{t.ui.formLink}</label><input required type="url" value={form.link} onChange={e=>setForm({...form,link:e.target.value})} className="w-full px-8 py-5 rounded-3xl bg-slate-50 border-none font-extrabold outline-none focus:ring-4 ring-indigo-500/10" placeholder="https://..." /></div>
                                        <div className="grid grid-cols-3 gap-3">
                                            <div><label className="text-[10px] font-black text-slate-300 uppercase mb-2 block">{t.ui.formSub}</label><select value={form.subject} onChange={e=>setForm({...form,subject:e.target.value})} className="w-full p-4 rounded-2xl bg-slate-50 font-bold border-none text-[10px] appearance-none">{t.subjects.map(s => <option key={s} value={s}>{s}</option>)}</select></div>
                                            <div><label className="text-[10px] font-black text-slate-300 uppercase mb-2 block">{t.ui.formYear}</label><select value={form.year} onChange={e=>setForm({...form,year:e.target.value})} className="w-full p-4 rounded-2xl bg-slate-50 font-bold border-none text-[10px] appearance-none">{t.years.map(y => <option key={y} value={y}>{y}</option>)}</select></div>
                                            <div><label className="text-[10px] font-black text-slate-300 uppercase mb-2 block">{t.ui.formType}</label><select value={form.type} onChange={e=>setForm({...form,type:e.target.value})} className="w-full p-4 rounded-2xl bg-slate-50 font-bold border-none text-[10px] appearance-none">{t.types.map(y => <option key={y} value={y}>{y}</option>)}</select></div>
                                        </div>
                                    </div>
                                    <div className="flex gap-5 pt-8"><button type="button" onClick={()=>setModal(null)} className="flex-1 py-5 text-slate-400 font-black uppercase text-xs tracking-widest leading-none">{t.ui.cancel}</button><button type="submit" className="flex-[2] py-6 bg-slate-900 text-white rounded-[2.5rem] font-black shadow-2xl hover:bg-indigo-600 transition-all uppercase text-sm leading-none">{t.ui.confirm}</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                    
                    {isBusy && (
                        <div className="fixed inset-0 z-[1000] modal-blur flex items-center justify-center">
                            <div className="bg-white p-12 rounded-[3rem] shadow-2xl flex flex-col items-center gap-6">
                                <div className="w-16 h-16 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                                <p className="font-black text-indigo-600 uppercase tracking-widest">{t.ui.uploading}</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
