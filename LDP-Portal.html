<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDP 成果收集与作品集</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="root"></div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 使用您提供的 Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyBezpJ9_6vPH7oUQyouhy1EoJNiXvciC0o",
            authDomain: "ldp-portal-8b38f.firebaseapp.com",
            projectId: "ldp-portal-8b38f",
            storageBucket: "ldp-portal-8b38f.firebasestorage.app",
            messagingSenderId: "378526911975",
            appId: "1:378526911975:web:2b14ea6ca18fefd6f34142",
            measurementId: "G-QR638Q5SBJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'ldp-submission-portal';

        // 将 Firebase 实例挂载到 window 供 React 使用
        window.fb = { auth, db, appId, collection, onSnapshot, doc, updateDoc, addDoc, signInAnonymously, onAuthStateChanged };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { auth, db, appId, collection, onSnapshot, doc, updateDoc, addDoc, signInAnonymously, onAuthStateChanged } = window.fb;

        const App = () => {
            const [user, setUser] = useState(null);
            const [teachers, setTeachers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [newName, setNewName] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [selectedTeacher, setSelectedTeacher] = useState(null);
            const [gameLink, setGameLink] = useState('');
            const [language, setLanguage] = useState('zh');

            // 初始化认证
            useEffect(() => {
                const init = async () => {
                    try {
                        await signInAnonymously(auth);
                    } catch (e) { console.error(e); }
                };
                init();
                const unsub = onAuthStateChanged(auth, setUser);
                return () => unsub();
            }, []);

            // 监听数据
            useEffect(() => {
                if (!user) return;
                const teachersCol = collection(db, 'artifacts', appId, 'public', 'data', 'teachers');
                const unsub = onSnapshot(teachersCol, (snapshot) => {
                    const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                    setTeachers(list);
                    setLoading(false);
                }, (err) => {
                    console.error("Firestore error:", err);
                    setLoading(false);
                });
                return () => unsub();
            }, [user]);

            const handleAdd = async (e) => {
                e.preventDefault();
                if (!newName.trim() || !user) return;
                setIsSubmitting(true);
                try {
                    const teachersCol = collection(db, 'artifacts', appId, 'public', 'data', 'teachers');
                    await addDoc(teachersCol, {
                        name: newName.trim(),
                        uid: user.uid,
                        link: '',
                        timestamp: Date.now()
                    });
                    setNewName('');
                } catch (e) { console.error(e); }
                finally { setIsSubmitting(false); }
            };

            const handleUpdate = async (e) => {
                e.preventDefault();
                if (!selectedTeacher || !gameLink.trim() || !user) return;
                setIsSubmitting(true);
                try {
                    const teacherDoc = doc(db, 'artifacts', appId, 'public', 'data', 'teachers', selectedTeacher.id);
                    await updateDoc(teacherDoc, {
                        link: gameLink.trim(),
                        updateTime: Date.now()
                    });
                    setSelectedTeacher(null);
                    setGameLink('');
                } catch (e) { console.error(e); }
                finally { setIsSubmitting(false); }
            };

            const t = {
                zh: {
                    title: "LDP 成果收集与作品集",
                    subtitle: "记录我们的 AI 教学创意",
                    attendance: "出席报到",
                    placeholderName: "请输入您的姓名 (如: Cikgu Ali)",
                    btnJoin: "确认报到",
                    gallery: "作品画廊",
                    noData: "暂无数据，请先报到或提交作品",
                    submitTitle: "提交作品链接",
                    placeholderLink: "粘贴您的 GitHub Pages 链接",
                    btnSubmit: "提交作品",
                    btnCancel: "取消",
                    btnPlay: "开始试玩",
                    btnUpdate: "更新作品",
                    statusSubmitted: "已提交",
                    statusPending: "待提交"
                },
                ms: {
                    title: "Portal Hasil LDP & Galeri Karya",
                    subtitle: "Rekod Kreativiti Pengajaran AI Kami",
                    attendance: "Pendaftaran Kehadiran",
                    placeholderName: "Masukkan nama anda (cth: Cikgu Ali)",
                    btnJoin: "Daftar Hadir",
                    gallery: "Galeri Hasil Karya",
                    noData: "Tiada data, sila daftar kehadiran dahulu",
                    submitTitle: "Hantar Pautan Karya",
                    placeholderLink: "Tampal pautan GitHub Pages anda",
                    btnSubmit: "Hantar Karya",
                    btnCancel: "Batal",
                    btnPlay: "Cuba Main",
                    btnUpdate: "Kemaskini",
                    statusSubmitted: "Telah Hantar",
                    statusPending: "Belum Hantar"
                }
            }[language];

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <header className="max-w-4xl mx-auto mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h1 className="text-3xl font-bold text-indigo-900 flex items-center gap-2">
                                <i data-lucide="award" class="text-indigo-600"></i> {t.title}
                            </h1>
                            <p className="text-slate-500 mt-1">{t.subtitle}</p>
                        </div>
                        <button 
                            onClick={() => setLanguage(language === 'zh' ? 'ms' : 'zh')}
                            className="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 rounded-full shadow-sm hover:bg-slate-50 transition-all text-sm font-medium"
                        >
                            <i data-lucide="globe" class="w-4 h-4 text-indigo-500"></i>
                            {language === 'zh' ? 'Tukar ke Bahasa Melayu' : '切换至中文'}
                        </button>
                    </header>

                    <main className="max-w-4xl mx-auto grid gap-8">
                        <section className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <h2 className="text-xl font-semibold mb-4 flex items-center gap-2">
                                <i data-lucide="user-plus" class="w-5 h-5 text-indigo-500"></i> {t.attendance}
                            </h2>
                            <form onSubmit={handleAdd} className="flex flex-col sm:flex-row gap-3">
                                <input 
                                    type="text" value={newName}
                                    onChange={(e) => setNewName(e.target.value)}
                                    placeholder={t.placeholderName}
                                    className="flex-1 px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none"
                                    required
                                />
                                <button disabled={isSubmitting} className="px-6 py-3 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 disabled:opacity-50 flex items-center justify-center gap-2">
                                    {isSubmitting ? "..." : t.btnJoin}
                                </button>
                            </form>
                        </section>

                        <section className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 min-h-[400px]">
                            <h2 className="text-xl font-semibold mb-6 flex items-center gap-2">
                                <i data-lucide="users" class="w-5 h-5 text-indigo-500"></i> {t.gallery}
                            </h2>
                            {loading ? (
                                <div className="text-center py-20 text-slate-400">加载中...</div>
                            ) : teachers.length === 0 ? (
                                <div className="text-center py-20 border-2 border-dashed border-slate-100 rounded-xl text-slate-400">
                                    {t.noData}
                                </div>
                            ) : (
                                <div className="grid gap-4">
                                    {teachers.map((teacher) => (
                                        <div key={teacher.id} className={`p-4 rounded-xl border transition-all flex flex-col md:flex-row md:items-center justify-between gap-4 ${teacher.link ? 'bg-indigo-50/30 border-indigo-100' : 'bg-slate-50/50 border-slate-100'}`}>
                                            <div className="flex items-center gap-4">
                                                <div className={`w-12 h-12 rounded-full flex items-center justify-center font-bold text-lg ${teacher.link ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-500'}`}>
                                                    {teacher.name.charAt(0).toUpperCase()}
                                                </div>
                                                <div>
                                                    <h3 className="font-bold text-slate-800">{teacher.name}</h3>
                                                    {teacher.link && (
                                                        <span className="text-xs px-2 py-0.5 bg-green-100 text-green-700 rounded flex items-center gap-1 mt-1 w-fit">
                                                            {t.statusSubmitted}
                                                        </span>
                                                    )}
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                {teacher.link && (
                                                    <a href={teacher.link} target="_blank" rel="noopener noreferrer" className="px-4 py-2 bg-white text-indigo-600 border border-indigo-200 rounded-lg hover:bg-indigo-50 transition-all flex items-center gap-2 text-sm font-medium">
                                                        {t.btnPlay}
                                                    </a>
                                                )}
                                                <button onClick={() => { setSelectedTeacher(teacher); setGameLink(teacher.link || ''); }} className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-all flex items-center gap-2 text-sm font-medium">
                                                    {teacher.link ? t.btnUpdate : t.btnSubmit}
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </section>
                    </main>

                    {selectedTeacher && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
                                <div className="p-6 bg-indigo-600 text-white font-bold">
                                    {t.submitTitle} - {selectedTeacher.name}
                                </div>
                                <form onSubmit={handleUpdate} className="p-6">
                                    <input 
                                        type="url" autoFocus required value={gameLink}
                                        onChange={(e) => setGameLink(e.target.value)}
                                        placeholder={t.placeholderLink}
                                        className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none mb-4"
                                    />
                                    <div className="flex gap-3">
                                        <button type="button" onClick={() => setSelectedTeacher(null)} className="flex-1 px-4 py-3 border border-slate-200 text-slate-600 rounded-xl hover:bg-slate-50 transition-all">{t.btnCancel}</button>
                                        <button disabled={isSubmitting} className="flex-1 px-4 py-3 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 disabled:opacity-50">
                                            {isSubmitting ? "..." : t.btnUpdate}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        // Initialize Lucide Icons after render
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
