<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生资料查询平台</title>
    <!-- 引入 Tailwind CSS 用于快速构建美观的界面 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Inter 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- 引入 QR Code 生成库 (保留，以防万一，但此版本不用) -->
    <!-- <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script> -->
    <style>
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- 顶部标题 -->
    <header id="header" class="bg-white shadow-md p-4 sticky top-0 z-10">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">学生信息平台</h1>
            <!-- 打印按钮已移除 -->
        </div>
    </header>

    <div class="container mx-auto p-4 md:p-8">

        <!-- 1. 加载视图 -->
        <div id="loading-view" class="text-center py-20">
            <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-blue-600 mx-auto"></div>
            <p class="mt-4 text-lg text-gray-600">正在加载数据...</p>
        </div>

        <!-- 2. 错误视图 -->
        <div id="error-view" class="text-center py-20 hidden">
            <h2 class="text-2xl font-bold text-red-600">加载失败</h2>
            <p id="error-message" class="mt-4 text-lg text-gray-600"></p>
        </div>

        <!-- 3. 搜索视图 (新增的默认视图) -->
        <div id="search-view" class="hidden bg-white rounded-lg shadow-xl max-w-2xl mx-auto p-6 md:p-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">查询学生资料</h2>
            <p class="text-gray-600 mb-4">请输入学生的唯一ID（例如：S001）进行查询。</p>
            <form id="search-form" class="flex space-x-2">
                <input type="text" id="search-id-input" placeholder="输入学生ID..." class="flex-grow p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg shadow hover:bg-blue-700 transition duration-300 font-medium">
                    查询
                </button>
            </form>
        </div>

        <!-- 4. 学生详细资料视图 (通过QR Code或搜索访问) -->
        <div id="detail-view" class="hidden bg-white rounded-lg shadow-xl max-w-2xl mx-auto p-6 md:p-8">
            <h2 class="text-3xl font-bold text-gray-900 mb-6 border-b pb-4" id="detail-name"></h2>
            <div id="detail-content" class="space-y-4">
                <!-- 详细资料将通过JS动态插入这里 -->
            </div>
            <button id="search-again-button" class="mt-8 text-blue-600 hover:text-blue-800 transition duration-300">
                &larr; 返回重新查询
            </button>
        </div>

    </div>

    <!-- 名卡模板已移除 -->

    <script>
        // ***************************************************************
        // ********** 重要配置               **********
        // ********** API URL 保持不变  **********
        // ***************************************************************
        const API_URL = "https://script.google.com/macros/s/AKfycbxSORX3S6I3VIcVR7JIm8TeG-EBR21D1xxoL_ExLo6r_FP8ZomBYTMsrVp2WrAIwm3BHA/exec";
        
        // 获取所有DOM元素
        const loadingView = document.getElementById('loading-view');
        const errorView = document.getElementById('error-view');
        const errorMessage = document.getElementById('error-message');
        const searchView = document.getElementById('search-view');
        const detailView = document.getElementById('detail-view');
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-id-input');
        const searchAgainButton = document.getElementById('search-again-button');


        /**
         * 页面加载时的主函数
         */
        window.addEventListener('DOMContentLoaded', () => {
            // 检查URL中是否有 'id' 参数
            const urlParams = new URLSearchParams(window.location.search);
            const studentId = urlParams.get('id');

            if (studentId) {
                // 如果有ID (来自QR扫描或搜索)，进入 "学生详细资料" 模式
                document.title = "学生详细资料";
                fetchStudentDetails(studentId);
            } else {
                // 如果没有ID，进入 "搜索" 模式
                document.title = "学生资料查询";
                loadingView.classList.add('hidden');
                searchView.classList.remove('hidden');
            }

            // 添加搜索表单事件
            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const idToSearch = searchInput.value.trim();
                if (idToSearch) {
                    // 重新加载页面并附带ID参数，这会触发上面的 'if (studentId)' 逻辑
                    // 这是最简单的方式，可以统一处理QR扫描和手动搜索
                    loadingView.classList.remove('hidden');
                    searchView.classList.add('hidden');
                    window.location.href = `${window.location.pathname}?id=${idToSearch}`;
                }
            });

            // 添加 "返回查询" 按钮事件
            searchAgainButton.addEventListener('click', () => {
                // 移除URL中的ID参数并重新加载
                window.location.href = window.location.pathname;
            });
        });

        /* * fetchAllStudents 函数已移除
         */

        /**
         * 模式B: 获取单个学生的详细信息
         */
        async function fetchStudentDetails(id) {
            try {
                const response = await fetch(`${API_URL}?id=${id}`);
                if (!response.ok) {
                    throw new Error(`网络响应错误: ${response.statusText}`);
                }
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }
                
                if (typeof data !== 'object' || Array.isArray(data)) {
                     throw new Error("从API返回的数据格式不正确（应为单个对象）。");
                }

                displayStudentDetails(data);

            } catch (error) {
                console.error('获取学生详细信息时出错:', error);
                // 如果查询的ID不存在，也显示错误
                showError(`加载学生 ${id} 的信息失败: ${error.message}。请检查ID是否正确。`);
            }
        }

        /* * displayCardGrid 函数已移除
         */

        /**
         * 显示学生详细资料
         */
        function displayStudentDetails(student) {
            loadingView.classList.add('hidden');
            searchView.classList.add('hidden'); // 确保搜索视图也隐藏
            detailView.classList.remove('hidden');

            // 设置标题名称
            document.getElementById('detail-name').textContent = student.name || '学生详细资料';
            
            const contentDiv = document.getElementById('detail-content');
            contentDiv.innerHTML = ''; // 清空内容

            // 动态生成所有资料
            // 排除 'id' 和 'name'
            const excludedKeys = ['id', 'name']; 
            
            // 定义一个更友好的中文标签映射 (可选)
            const labelMap = {
                'class': '班级',
                'parentName': '家长姓名',
                'parentPhone': '家长电话',
                'allergies': '过敏信息',
                // 您可以在这里添加更多映射
            };

            for (const key in student) {
                if (student.hasOwnProperty(key) && !excludedKeys.includes(key)) {
                    const value = student[key] || '（未填写）';
                    // 优先使用中文标签，否则使用原始的列标题
                    const label = labelMap[key] || key;
                    
                    const detailItem = document.createElement('div');
                    detailItem.innerHTML = `
                        <span class="block text-sm font-medium text-gray-500">${label}</span>
                        <span class="block text-lg font-semibold text-gray-800">${value}</span>
                    `;
                    contentDiv.appendChild(detailItem);
                }
            }
        }

        /**
         * 显示错误信息
         */
        function showError(message) {
            loadingView.classList.add('hidden');
            searchView.classList.add('hidden'); // 隐藏搜索
            detailView.classList.add('hidden'); // 隐藏详情
            errorView.classList.remove('hidden');
            
            let detailedMessage = message;

            // 检查是否是 "工作表...未找到" 的特定错误
            if (message.includes("工作表") && message.includes("未找到")) {
                errorMessage.innerHTML = `
                    <p class="font-bold text-lg mb-2">配置错误：${message}</p>
                    <p class="text-left max-w-lg mx-auto">
                        <strong>如何修复：</strong>
                        <ol class="list-decimal list-inside mt-2 space-y-1">
                            <li>打开您的 Google Sheet。</li>
                            <li>查看您学生资料的工作表（底部的标签页），确保名称<strong>完全正确</strong>。</li>
                            <li>打开您的 <strong>Google Apps Script (Code.gs)</strong> 文件。</li>
                            <li>找到第 11 行 (或附近) 的 <code>const SHEET_NAME = "...";</code></li>
                            <li>将 <code>...</code> 替换为您在第2步中确认的<strong>一模一样</strong>的名称。</li>
                            <li>点击 "部署" > "管理部署" > "编辑" (铅笔图标) > "新版本" > "部署"。</li>
                            <li>完成后，再刷新此页面。</li>
                        </ol>
                    </p>
                `;
            } else {
                 errorMessage.textContent = detailedMessage;
            }
        }

    </script>
</body>
</html>
