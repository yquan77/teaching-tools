<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字数列大对决 - Math Battle</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- 引入 Babel 用于解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 引入中文字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        /* 自定义抖动动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.2s ease-in-out 2;
        }

        /* 简单的淡入动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-900 text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 图标组件 (替代 lucide-react) ---
        const IconBase = ({ children, className, ...props }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="24" height="24" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
                {...props}
            >
                {children}
            </svg>
        );

        const Shield = (props) => (
            <IconBase {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></IconBase>
        );
        const Skull = (props) => (
            <IconBase {...props}><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><path d="M8 20v2h8v-2"/><path d="M12.5 17l-.5-4"/><path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"/></IconBase>
        );
        const Swords = (props) => (
            <IconBase {...props}><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" y1="14" x2="9" y2="18"/><line x1="7" y1="17" x2="4" y2="20"/><line x1="3" y1="19" x2="5" y2="21"/></IconBase>
        );
        const Trophy = (props) => (
            <IconBase {...props}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></IconBase>
        );
        const RefreshCw = (props) => (
            <IconBase {...props}><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></IconBase>
        );

        // --- 游戏逻辑配置 ---

        const LEVELS = {
            1: { types: ['ones', 'tens'], label: '初级挑战 (1和10)' },
            2: { types: ['twos', 'fives'], label: '中级挑战 (2和5)' },
            3: { types: ['hundreds', 'twos', 'fives', 'tens'], label: '高级挑战 (混合)' }
        };

        // 产生数列问题
        const generateProblem = (level = 1) => {
            const levelConfig = LEVELS[level] || LEVELS[1];
            const type = levelConfig.types[Math.floor(Math.random() * levelConfig.types.length)];
            
            let start, step, length = 4;
            const base = Math.floor(Math.random() * 500) + 100; // 100 - 600 range

            switch (type) {
                case 'ones': step = 1; start = base; break;
                case 'twos': step = 2; start = base; break;
                case 'fives': step = 5; start = Math.floor(base / 5) * 5; break;
                case 'tens': step = 10; start = Math.floor(base / 10) * 10; break;
                case 'hundreds': step = 100; start = Math.floor(Math.random() * 4) * 100 + 100; break;
                default: step = 1; start = base;
            }

            const isAscending = Math.random() > 0.4; // 60% chance ascending
            let sequence = [];
            
            for (let i = 0; i < length; i++) {
                sequence.push(isAscending ? start + (i * step) : start + ((length - 1 - i) * step));
            }

            const missingIndex = Math.floor(Math.random() * length);
            const answer = sequence[missingIndex];
            
            // 生成干扰项
            let options = [answer];
            while (options.length < 3) {
                const offset = (Math.floor(Math.random() * 3) + 1) * step;
                const distractor = Math.random() > 0.5 ? answer + offset : answer - offset;
                if (!options.includes(distractor) && distractor > 0) {
                    options.push(distractor);
                }
            }
            
            return {
                sequence,
                missingIndex,
                answer,
                options: options.sort(() => Math.random() - 0.5),
                type,
                step,
                isAscending
            };
        };

        // --- 组件 ---

        const HealthBar = ({ current, max, isPlayer, name }) => (
            <div className={`flex flex-col ${isPlayer ? 'items-start' : 'items-end'} w-full max-w-[45%]`}>
                <div className="flex items-center gap-2 mb-1">
                    {isPlayer ? <Shield className="text-blue-500" fill="currentColor" /> : <Skull className="text-red-500" fill="currentColor" />}
                    <span className="font-black text-lg text-white drop-shadow-md">{name}</span>
                </div>
                <div className="w-full h-6 bg-gray-800 rounded-full border-2 border-white/50 overflow-hidden relative shadow-lg">
                    <div 
                        className={`h-full transition-all duration-500 ease-out ${isPlayer ? 'bg-gradient-to-r from-blue-400 to-blue-600' : 'bg-gradient-to-l from-red-400 to-red-600'}`}
                        style={{ width: `${Math.max(0, (current / max) * 100)}%` }}
                    ></div>
                </div>
                <div className="text-white font-bold text-sm mt-1">{current}/{max} HP</div>
            </div>
        );

        const Character = ({ isPlayer, isAttacking, isHit }) => {
            const baseClass = `transition-transform duration-200 ${isAttacking ? (isPlayer ? 'translate-x-20' : '-translate-x-20') : ''} ${isHit ? 'animate-shake opacity-50' : ''}`;
            
            return (
                <div className={`relative ${baseClass}`}>
                    {isPlayer ? (
                        // Player Avatar (Hero)
                        <div className="w-24 h-24 md:w-32 md:h-32">
                            <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-2xl">
                                <circle cx="50" cy="50" r="40" fill="#3B82F6" stroke="white" strokeWidth="4" />
                                <rect x="30" y="40" width="15" height="15" fill="white" rx="5" />
                                <rect x="55" y="40" width="15" height="15" fill="white" rx="5" />
                                <path d="M 35 70 Q 50 85 65 70" stroke="white" strokeWidth="4" fill="none" />
                                <path d="M 20 50 L 5 40" stroke="#3B82F6" strokeWidth="8" strokeLinecap="round" /> 
                                <path d="M 80 50 L 95 40" stroke="#3B82F6" strokeWidth="8" strokeLinecap="round" />
                            </svg>
                            {isAttacking && (
                                <div className="absolute right-[-40px] top-0 text-5xl animate-ping">⚔️</div>
                            )}
                        </div>
                    ) : (
                        // Enemy Avatar (Monster)
                        <div className="w-24 h-24 md:w-32 md:h-32">
                            <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-2xl">
                                <path d="M 20 20 L 80 20 L 90 50 L 80 90 L 20 90 L 10 50 Z" fill="#EF4444" stroke="#7F1D1D" strokeWidth="4" />
                                <circle cx="35" cy="45" r="5" fill="yellow" />
                                <circle cx="65" cy="45" r="5" fill="yellow" />
                                <path d="M 30 70 L 40 60 L 50 70 L 60 60 L 70 70" stroke="black" strokeWidth="3" fill="none" />
                                <path d="M 20 20 L 10 5" stroke="#EF4444" strokeWidth="5" />
                                <path d="M 80 20 L 90 5" stroke="#EF4444" strokeWidth="5" />
                            </svg>
                            {isAttacking && (
                                <div className="absolute left-[-40px] top-0 text-5xl animate-ping">🔥</div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        // --- 主程序 ---

        function MathBattle() {
            const [gameState, setGameState] = useState('menu'); // menu, playing, won, lost
            const [level, setLevel] = useState(1);
            const [playerHP, setPlayerHP] = useState(100);
            const [enemyHP, setEnemyHP] = useState(100);
            const [problem, setProblem] = useState(null);
            const [combo, setCombo] = useState(0);
            const [animState, setAnimState] = useState({ playerAttack: false, enemyAttack: false, playerHit: false, enemyHit: false });
            const [monsterTimer, setMonsterTimer] = useState(0);
            const [monsterMaxTime, setMonsterMaxTime] = useState(100); 
            
            const timerRef = useRef(null);

            // 启动游戏
            const startGame = (selectedLevel) => {
                setLevel(selectedLevel);
                setPlayerHP(100);
                setEnemyHP(100 + (selectedLevel * 20)); 
                setCombo(0);
                setMonsterMaxTime(100 - (selectedLevel * 10)); 
                setGameState('playing');
                nextTurn(selectedLevel);
            };

            // 生成下一回合
            const nextTurn = (lvl) => {
                const newProblem = generateProblem(lvl);
                setProblem(newProblem);
                setMonsterTimer(0);
                setAnimState({ playerAttack: false, enemyAttack: false, playerHit: false, enemyHit: false });
                
                // Start monster timer
                if (timerRef.current) clearInterval(timerRef.current);
                timerRef.current = setInterval(() => {
                    setMonsterTimer(prev => {
                        if (prev >= 100) {
                            handleEnemyAttack();
                            return 0;
                        }
                        return prev + 1; // Speed of filling bar
                    });
                }, 100 - (lvl * 15)); // Timer speed
            };

            // 玩家攻击逻辑
            const handlePlayerAttack = (damage) => {
                setAnimState(prev => ({ ...prev, playerAttack: true }));
                clearInterval(timerRef.current); // Stop monster timer
                
                setTimeout(() => {
                    setAnimState(prev => ({ ...prev, playerAttack: false, enemyHit: true }));
                    const newEnemyHP = Math.max(0, enemyHP - damage);
                    setEnemyHP(newEnemyHP);
                    setCombo(c => c + 1);

                    if (newEnemyHP <= 0) {
                        setTimeout(() => endGame('won'), 1000);
                    } else {
                        setTimeout(() => nextTurn(level), 1000);
                    }
                }, 500);
            };

            // 敌人攻击逻辑 (超时或答错)
            const handleEnemyAttack = () => {
                clearInterval(timerRef.current);
                setAnimState(prev => ({ ...prev, enemyAttack: true }));
                setCombo(0);

                setTimeout(() => {
                    setAnimState(prev => ({ ...prev, enemyAttack: false, playerHit: true }));
                    const damage = 20 + (level * 5);
                    const newPlayerHP = Math.max(0, playerHP - damage);
                    setPlayerHP(newPlayerHP);

                    if (newPlayerHP <= 0) {
                        setTimeout(() => endGame('lost'), 1000);
                    } else {
                        setTimeout(() => nextTurn(level), 1000);
                    }
                }, 500);
            };

            const endGame = (result) => {
                setGameState(result);
                clearInterval(timerRef.current);
            };

            const checkAnswer = (val) => {
                if (val === problem.answer) {
                    handlePlayerAttack(20 + (combo * 5));
                } else {
                    handleEnemyAttack(); 
                }
            };

            useEffect(() => {
                return () => clearInterval(timerRef.current);
            }, []);

            // --- 渲染 ---

            return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 font-sans select-none overflow-hidden text-white">
                    
                    {/* 背景装饰 */}
                    <div className="fixed inset-0 pointer-events-none opacity-20">
                        <div className="absolute top-10 left-10 w-32 h-32 bg-purple-500 rounded-full blur-3xl"></div>
                        <div className="absolute bottom-10 right-10 w-40 h-40 bg-blue-500 rounded-full blur-3xl"></div>
                    </div>

                    <div className="w-full max-w-4xl bg-slate-800/80 backdrop-blur-md rounded-3xl border-4 border-slate-600 shadow-2xl overflow-hidden relative min-h-[600px] flex flex-col">
                        
                        {/* === 菜单界面 === */}
                        {gameState === 'menu' && (
                            <div className="flex-1 flex flex-col items-center justify-center space-y-8 p-8 animate-fade-in text-center">
                                <div className="bg-yellow-500 p-6 rounded-full shadow-[0_0_30px_rgba(234,179,8,0.5)]">
                                    <Swords size={64} className="text-white animate-pulse" />
                                </div>
                                <h1 className="text-5xl md:text-6xl font-black text-white tracking-wider drop-shadow-lg">
                                    <span className="text-blue-400">数字</span>数列<span className="text-red-400">大对决</span>
                                </h1>
                                <p className="text-slate-300 text-xl">二年级数学 • 挑战怪兽，填补数列！</p>
                                
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 w-full max-w-2xl mt-8">
                                    {[1, 2, 3].map(lvl => (
                                        <button
                                            key={lvl}
                                            onClick={() => startGame(lvl)}
                                            className="group relative overflow-hidden bg-slate-700 hover:bg-indigo-600 p-6 rounded-2xl border-b-4 border-slate-900 hover:border-indigo-800 transition-all transform hover:-translate-y-2 active:translate-y-0"
                                        >
                                            <div className="relative z-10">
                                                <div className="text-2xl font-black text-white mb-2">Level {lvl}</div>
                                                <div className="text-slate-300 group-hover:text-indigo-200 font-medium">{LEVELS[lvl].label}</div>
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* === 游戏界面 === */}
                        {gameState === 'playing' && problem && (
                            <div className="flex-1 flex flex-col relative">
                                
                                {/* 顶部：生命值 & 状态 */}
                                <div className="flex justify-between items-start p-4 md:p-6 bg-black/20">
                                    <HealthBar current={playerHP} max={100} isPlayer={true} name="你 (Hero)" />
                                    <div className="flex flex-col items-center pt-2">
                                        <div className="text-yellow-400 font-black text-2xl drop-shadow-md">VS</div>
                                        {combo > 1 && (
                                            <div className="bg-yellow-500 text-yellow-900 px-3 py-1 rounded-full text-xs font-bold animate-bounce mt-2">
                                                {combo} 连击!
                                            </div>
                                        )}
                                    </div>
                                    <HealthBar current={enemyHP} max={100 + (level * 20)} isPlayer={false} name="数学怪兽" />
                                </div>

                                {/* 中部：战场与角色 */}
                                <div className="flex-1 flex justify-between items-center px-8 md:px-20 relative">
                                    <Character isPlayer={true} isAttacking={animState.playerAttack} isHit={animState.playerHit} />
                                    
                                    {/* 怪兽攻击倒计时条 */}
                                    <div className="absolute left-1/2 bottom-10 transform -translate-x-1/2 w-48 md:w-64 h-2 bg-slate-700 rounded-full overflow-hidden border border-slate-500/50">
                                        <div 
                                            className="h-full bg-red-500 transition-all duration-100 ease-linear"
                                            style={{ width: `${monsterTimer}%` }}
                                        ></div>
                                    </div>

                                    <Character isPlayer={false} isAttacking={animState.enemyAttack} isHit={animState.enemyHit} />
                                </div>

                                {/* 题目区域 */}
                                <div className="bg-slate-900/90 p-6 border-t-4 border-slate-700 relative">
                                    <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-indigo-600 text-white px-6 py-2 rounded-full font-bold shadow-lg border-2 border-indigo-400 text-sm md:text-base whitespace-nowrap">
                                        {problem.isAscending ? '从小到大 (顺序)' : '从大到小 (逆序)'} • {problem.step}个{problem.step}个地数
                                    </div>

                                    <div className="flex justify-center items-center gap-2 md:gap-4 mb-8 mt-4">
                                        {problem.sequence.map((num, idx) => (
                                            <div key={idx} className="flex items-center">
                                                <div className={`
                                                    w-16 h-16 md:w-24 md:h-24 flex items-center justify-center rounded-xl text-xl md:text-3xl font-black shadow-inner
                                                    ${idx === problem.missingIndex 
                                                        ? 'bg-slate-700 text-yellow-400 border-2 border-yellow-400 animate-pulse' 
                                                        : 'bg-slate-100 text-slate-800'}
                                                `}>
                                                    {idx === problem.missingIndex ? '?' : num}
                                                </div>
                                                {idx < problem.sequence.length - 1 && (
                                                    <div className="w-4 h-1 md:w-8 md:h-2 bg-slate-600 mx-1 md:mx-2 rounded-full opacity-50"></div>
                                                )}
                                            </div>
                                        ))}
                                    </div>

                                    {/* 答案按钮 */}
                                    <div className="grid grid-cols-3 gap-4 max-w-2xl mx-auto">
                                        {problem.options.map((opt, i) => (
                                            <button
                                                key={i}
                                                onClick={() => checkAnswer(opt)}
                                                className="bg-blue-600 hover:bg-blue-500 border-b-4 border-blue-800 text-white font-bold text-2xl py-4 rounded-xl active:border-b-0 active:translate-y-1 transition-all"
                                            >
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* === 结算界面 === */}
                        {(gameState === 'won' || gameState === 'lost') && (
                            <div className="flex-1 flex flex-col items-center justify-center space-y-6 animate-fade-in bg-slate-900/90 z-20">
                                {gameState === 'won' ? (
                                    <Trophy size={100} className="text-yellow-400 animate-bounce" />
                                ) : (
                                    <Skull size={100} className="text-red-500 animate-pulse" />
                                )}
                                
                                <h2 className={`text-5xl font-black ${gameState === 'won' ? 'text-yellow-400' : 'text-red-500'}`}>
                                    {gameState === 'won' ? '挑战成功！' : '挑战失败...'}
                                </h2>
                                
                                <p className="text-slate-300 text-xl">
                                    {gameState === 'won' ? '你击败了数学怪兽！' : '不要灰心，再试一次！'}
                                </p>

                                <button 
                                    onClick={() => setGameState('menu')}
                                    className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 px-8 py-4 rounded-full font-bold text-white text-xl transition-all shadow-lg hover:shadow-indigo-500/50"
                                >
                                    <RefreshCw /> 返回菜单
                                </button>
                            </div>
                        )}

                    </div>
                    
                    {/* 底部版权/提示 */}
                    <div className="fixed bottom-2 text-slate-500 text-xs">
                        © 二年级数学 • 1.7 有规律的数列
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MathBattle />);
    </script>
</body>
</html>
