<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kebun Pintar KVKV - Edisi Guru AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue-team: #3abff8;
            --red-team: #f87272;
            --grass-top: #bbf7d0;
            --grass-bottom: #22c55e;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            background: #a7f3d0;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            touch-action: manipulation;
        }

        /* 封面与加载样式 */
        #game-cover {
            position: fixed;
            inset: 0;
            z-index: 5000;
            background: linear-gradient(to bottom, #7dd3fc, #22c55e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
            padding: 20px;
        }

        .word-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-top: 20px;
            max-width: 600px;
        }

        .loading-card {
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            border: 2px solid white;
            transition: all 0.3s;
            cursor: pointer;
        }

        .card-success { background: #2dd4bf; color: white; border-color: #0f766e; }
        .card-fail { background: #f87171; color: white; border-color: #b91c1c; animation: pulse 1.5s infinite; }
        .card-pending { background: #e2e8f0; color: #64748b; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        /* 游戏界面 UI */
        .garden-bg {
            background: linear-gradient(to bottom, #7dd3fc 0%, #7dd3fc 30%, var(--grass-top) 30%, var(--grass-bottom) 100%);
            position: relative;
            height: 100vh;
            width: 100vw;
        }

        .progress-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.9);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 4px 0 #cbd5e1;
            z-index: 200;
            cursor: pointer;
            border: 2px solid #3b82f6;
        }

        /* 状态详情面板 */
        #status-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            z-index: 3000;
            display: none;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2999;
            display: none;
        }

        /* 打地鼠核心样式 */
        .team-side {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 140px 10px 40px 10px;
            gap: 10px;
        }

        .hole {
            position: relative;
            background: #451a03;
            border-radius: 50% / 30%;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .mole {
            position: relative;
            bottom: -110%;
            width: 90%;
            height: 100%;
            transition: bottom 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .mole.up { bottom: 0%; }

        .word-tag {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 2px 8px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.9rem;
            color: #1e3a8a;
            border: 2px solid #3b82f6;
            white-space: nowrap;
            z-index: 30;
        }
    </style>
</head>
<body>

    <!-- 覆盖层/加载页 -->
    <div id="game-cover">
        <h1 class="font-bold text-white text-4xl mb-4" style="font-family: 'Fredoka One'">KEBUN KVKV</h1>
        
        <div id="loading-container" class="w-full flex flex-col items-center">
            <div class="word-grid" id="init-word-grid"></div>
            <p class="text-white mt-6 font-bold" id="loader-msg">Memuatkan suara AI...</p>
            <button id="start-btn" class="mt-6 bg-gray-400 text-white px-10 py-3 rounded-full font-bold text-xl cursor-not-allowed border-b-4 border-gray-600">
                MENUNGGU...
            </button>
            <p class="text-white/80 text-xs mt-2">*Klik kotak merah untuk cuba lagi</p>
        </div>
    </div>

    <!-- 详情面板 -->
    <div class="overlay" id="overlay" onclick="toggleStatusPanel(false)"></div>
    <div id="status-panel">
        <h2 class="font-bold text-lg mb-3 flex justify-between">
            Status Suara AI <span id="panel-count">0/18</span>
        </h2>
        <div class="grid grid-cols-3 gap-2" id="panel-word-grid"></div>
        <button class="w-full mt-4 bg-blue-500 text-white py-2 rounded-lg font-bold" onclick="toggleStatusPanel(false)">Tutup</button>
    </div>

    <div class="garden-bg">
        <!-- 顶部信息 -->
        <div class="score-board flex justify-center gap-4 pt-4">
            <div class="bg-white px-4 py-1 rounded-xl border-2 border-blue-400 text-blue-600 font-bold">
                BIRU: <span id="score-blue">0</span>
            </div>
            <div class="bg-white px-4 py-1 rounded-xl border-2 border-red-400 text-red-600 font-bold">
                MERAH: <span id="score-red">0</span>
            </div>
        </div>

        <div id="voice-progress" class="progress-btn text-blue-600 text-sm" onclick="toggleStatusPanel(true)">
            AI: 0/18 ⚡
        </div>

        <div class="absolute top-[85px] left-1/2 -translate-x-1/2 z-[100]">
            <button class="bg-white px-4 py-2 rounded-full shadow-md font-bold flex items-center gap-2" onclick="speakTargetAI()">
                🔊 <span id="voice-label">Dengar</span>
            </button>
        </div>

        <div class="flex h-full">
            <div class="team-side" id="grid-blue">
                <div class="hole"><div class="mole" onclick="whack(event, 'blue')"></div></div>
                <div class="hole"><div class="mole" onclick="whack(event, 'blue')"></div></div>
                <div class="hole"><div class="mole" onclick="whack(event, 'blue')"></div></div>
                <div class="hole"><div class="mole" onclick="whack(event, 'blue')"></div></div>
                <div class="hole"><div class="mole" onclick="whack(event, 'blue')"></div></div>
                <div class="hole"><div class="mole" onclick="whack(event, 'blue')"></div></div>
            </div>
            <div class="team-side" id="grid-red">
                <div class="hole"><div class="mole" onclick="whack(event, 'red')"></div></div>
                <div class="hole"><div class="mole" onclick="whack(event, 'red')"></div></div>
                <div class="hole"><div class="mole" onclick="whack(event, 'red')"></div></div>
                <div class="hole"><div class="mole" onclick="whack(event, 'red')"></div></div>
                <div class="hole"><div class="mole" onclick="whack(event, 'red')"></div></div>
                <div class="hole"><div class="mole" onclick="whack(event, 'red')"></div></div>
            </div>
        </div>
    </div>

    <script>
        const words = ["buku", "sudu", "topi", "nasi", "cili", "bola", "siku", "dadu", "baju", "tali", "meja", "gigi", "bata", "bahu", "beca", "teko", "kopi", "roti"];
        const apiKey = ""; 
        let currentTarget = "";
        let scores = { blue: 0, red: 0 };
        let isGameActive = false;
        let voiceCache = {}; 

        const moleSVG = `
            <svg class="w-full h-full" viewBox="0 0 100 100">
                <ellipse cx="25" cy="20" rx="6" ry="10" fill="#A0522D" />
                <ellipse cx="75" cy="20" rx="6" ry="10" fill="#A0522D" />
                <ellipse cx="50" cy="75" rx="35" ry="40" fill="#A0522D" />
                <ellipse cx="50" cy="85" rx="18" ry="20" fill="#DEB887" opacity="0.6" />
                <circle cx="40" cy="60" r="3" fill="white" /><circle cx="60" cy="60" r="3" fill="white" />
                <circle cx="41" cy="59" r="1" fill="black" /><circle cx="61" cy="59" r="1" fill="black" />
                <ellipse cx="50" cy="68" rx="4" ry="2" fill="#333" />
            </svg>
            <div class="word-tag"></div>
        `;

        function updateUIStatus() {
            const successCount = Object.values(voiceCache).filter(v => v.type === 'ai').length;
            const total = words.length;
            
            // 更新进度文字
            const progressStr = `AI: ${successCount}/${total} ⚡`;
            document.getElementById('voice-progress').innerText = progressStr;
            document.getElementById('panel-count').innerText = `${successCount}/${total}`;

            // 更新 Loading 页和面板的卡片颜色
            words.forEach(word => {
                const status = voiceCache[word]?.type || 'pending';
                const elInit = document.getElementById(`card-init-${word}`);
                const elPanel = document.getElementById(`card-panel-${word}`);
                
                [elInit, elPanel].forEach(el => {
                    if (!el) return;
                    el.className = `loading-card text-center ${status === 'ai' ? 'card-success' : (status === 'local' ? 'card-fail' : 'card-pending')}`;
                });
            });

            // 如果全部成功或至少加载过一次，启用开始按钮
            const startBtn = document.getElementById('start-btn');
            if (Object.keys(voiceCache).length === total) {
                startBtn.innerText = "MULA BERMAIN";
                startBtn.classList.remove('bg-gray-400', 'cursor-not-allowed');
                startBtn.classList.add('bg-yellow-400', 'text-amber-900', 'border-amber-600');
                startBtn.onclick = startGame;
            }
        }

        async function fetchVoice(text, isRetry = false) {
            if (voiceCache[text]?.type === 'ai') return;

            // 设为加载中状态（可选逻辑）
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Sebutkan perkataan "${text}" dengan suara seorang guru lelaki yang sangat rasmi, tenang, perlahan dan jelas. Tanpa sebarang gaya hiasan.` }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Enceladus" } } }
                        }
                    })
                });
                const result = await response.json();
                const data = result?.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                if (data) {
                    const blob = pcmToWav(data, 24000);
                    voiceCache[text] = { type: 'ai', url: URL.createObjectURL(blob) };
                } else {
                    throw new Error("No audio data");
                }
            } catch (e) {
                if (!isRetry) voiceCache[text] = { type: 'local', url: null };
            }
            updateUIStatus();
        }

        function pcmToWav(base64, sampleRate) {
            const buffer = Uint8Array.from(atob(base64), c => c.charCodeAt(0)).buffer;
            const wavHeader = new ArrayBuffer(44);
            const view = new DataView(wavHeader);
            const writeString = (offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(0, 'RIFF'); view.setUint32(4, 32 + buffer.byteLength, true); writeString(8, 'WAVE'); writeString(12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeString(36, 'data'); view.setUint32(40, buffer.byteLength, true);
            return new Blob([wavHeader, buffer], { type: 'audio/wav' });
        }

        function toggleStatusPanel(show) {
            document.getElementById('status-panel').style.display = show ? 'block' : 'none';
            document.getElementById('overlay').style.display = show ? 'block' : 'none';
        }

        function startGame() {
            document.getElementById('game-cover').style.transform = 'translateY(-100%)';
            isGameActive = true;
            nextRound();
            setInterval(gameLoop, 3800);
            startBackgroundUpdater();
        }

        // 后台持续更新
        function startBackgroundUpdater() {
            setInterval(() => {
                const fails = words.filter(w => voiceCache[w]?.type === 'local');
                if (fails.length > 0) fetchVoice(fails[0], true);
            }, 8000);
        }

        async function speakTargetAI() {
            const voice = voiceCache[currentTarget];
            if (!voice || voice.type === 'local') {
                const msg = new SpeechSynthesisUtterance(currentTarget);
                msg.lang = 'ms-MY';
                msg.pitch = 1.2; // 女声
                msg.rate = 0.7;
                window.speechSynthesis.speak(msg);
                document.getElementById('voice-label').innerText = "Lokal ♀";
            } else {
                new Audio(voice.url).play();
                document.getElementById('voice-label').innerText = "AI ♂";
            }
        }

        function nextRound() {
            currentTarget = words[Math.floor(Math.random() * words.length)];
            speakTargetAI();
        }

        function gameLoop() {
            if (!isGameActive) return;
            document.querySelectorAll('.mole').forEach(m => m.classList.remove('up'));
            setTimeout(() => {
                ['blue', 'red'].forEach(team => {
                    const moles = document.querySelectorAll(`#grid-${team} .mole`);
                    const correctIdx = Math.floor(Math.random() * moles.length);
                    moles.forEach((mole, idx) => {
                        const word = idx === correctIdx ? currentTarget : words[Math.floor(Math.random() * words.length)];
                        mole.querySelector('.word-tag').innerText = word;
                        mole.dataset.word = word;
                        setTimeout(() => mole.classList.add('up'), Math.random() * 800);
                    });
                });
            }, 600);
        }

        function whack(e, team) {
            if (!isGameActive) return;
            const mole = e.currentTarget;
            if (!mole.classList.contains('up')) return;
            mole.classList.remove('up');
            if (mole.dataset.word === currentTarget) {
                scores[team] += 20;
                nextRound();
            } else {
                scores[team] = Math.max(0, scores[team] - 10);
            }
            document.getElementById(`score-${team}`).innerText = scores[team];
        }

        // 初始化页面
        window.onload = async () => {
            const initGrid = document.getElementById('init-word-grid');
            const panelGrid = document.getElementById('panel-word-grid');
            
            words.forEach(word => {
                // 创建加载页卡片
                const card = document.createElement('div');
                card.id = `card-init-${word}`;
                card.innerText = word;
                card.className = 'loading-card card-pending text-center';
                card.onclick = () => fetchVoice(word, true);
                initGrid.appendChild(card);

                // 创建详情面板卡片
                const pCard = document.createElement('div');
                pCard.id = `card-panel-${word}`;
                pCard.innerText = word;
                pCard.className = 'loading-card card-pending text-center';
                pCard.onclick = () => fetchVoice(word, true);
                panelGrid.appendChild(pCard);
            });

            document.querySelectorAll('.mole').forEach(m => m.innerHTML = moleSVG);
            
            // 开始逐个加载
            for (const word of words) {
                await fetchVoice(word);
                await new Promise(r => setTimeout(r, 150));
            }
        };
    </script>
</body>
</html>
