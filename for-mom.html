<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>致1N、2N、3N的家长妈咪们</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --warm-pink: #ff9aaf;
            --gold: #d4af37;
        }

        body {
            background: linear-gradient(180deg, #fff5f6 0%, #ffebef 100%);
            font-family: 'Noto Sans SC', sans-serif;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .font-calligraphy {
            font-family: 'Ma Shan Zheng', cursive;
        }

        /* 核心照片卡片样式 */
        .main-card {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(255, 154, 175, 0.3);
            border: 2px solid rgba(212, 175, 55, 0.3);
            transform: rotate(-1deg);
            transition: all 0.5s ease;
            position: relative;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 飘落物 */
        .flower {
            position: fixed;
            top: -10%;
            pointer-events: none;
            z-index: 5;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        /* 祝福语容器 */
        .message-box {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid white;
            border-radius: 20px;
            box-shadow: inset 0 0 15px rgba(255, 182, 193, 0.2);
        }

        #interaction-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .heart-count-tag {
            background: linear-gradient(45deg, #ff85a2, #ffb6c1);
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            box-shadow: 0 4px 10px rgba(255, 133, 162, 0.3);
        }

        /* 切换动画 */
        .photo-transition {
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }
        .photo-hidden {
            opacity: 0;
            transform: scale(0.95);
        }

        /* 导航按钮 */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff85a2;
            font-size: 20px;
            cursor: pointer;
            z-index: 40;
            border: none;
            box-shadow: 0 4px 12px rgba(255, 133, 162, 0.2);
            -webkit-tap-highlight-color: transparent;
        }
        .nav-btn:active { background: #fff5f6; transform: translateY(-50%) scale(0.9); }
    </style>
</head>
<body class="flex flex-col items-center">

    <canvas id="interaction-canvas"></canvas>

    <!-- 顶部 -->
    <div class="w-full text-center py-8 z-10">
        <h2 class="text-pink-400 text-lg tracking-[0.2em] font-light">致 1N、2N、3N</h2>
        <h1 class="text-5xl font-calligraphy text-pink-500 mt-2">家长妈咪们</h1>
        <div class="flex justify-center mt-2">
            <div class="h-1 w-16 bg-pink-300 rounded-full"></div>
        </div>
    </div>

    <!-- 核心区 -->
    <main class="w-full max-w-sm px-4 z-20 space-y-8">
        
        <div class="main-card relative" id="photo-card">
            <!-- 导航按钮 -->
            <button onclick="prevPhoto(event)" class="nav-btn -left-4">❮</button>
            <button onclick="nextPhoto(event)" class="nav-btn -right-4">❯</button>

            <!-- 照片显示：默认第一张 -->
            <img id="display-img" 
                 src="https://raw.githubusercontent.com/yquan77/teaching-tools/refs/heads/main/imagesformom/IMG_2594.jpg" 
                 alt="班级照片" 
                 class="w-full h-auto rounded-lg shadow-inner photo-transition"
                 onerror="handleImageError(this)">
            
            <!-- 页码 -->
            <div class="absolute -bottom-3 left-4 bg-white px-4 py-1 rounded-full shadow-md z-30 border border-pink-100">
                <span id="photo-index" class="text-pink-500 font-bold text-xs italic">正在加载...</span>
            </div>

            <!-- 右上角小装饰 -->
            <div class="absolute -top-3 -right-3 bg-pink-500 w-10 h-10 rounded-full flex items-center justify-center text-white shadow-lg z-30 border-2 border-white">
                <span class="text-lg">📷</span>
            </div>
        </div>

        <!-- 祝福语 -->
        <div class="message-box p-6 text-center">
            <p id="dynamic-wish" class="text-gray-700 text-lg leading-relaxed italic">
                “感谢各位妈咪一直以来对班级工作的支持，祝您母亲节快乐！”
            </p>
            <div class="mt-6 flex flex-col items-center gap-3">
                <button onclick="changeWish()" class="text-pink-400 text-xs font-bold border border-pink-200 px-4 py-1 rounded-full hover:bg-pink-50 transition-colors">
                    换一句心里话 ✨
                </button>
                <div class="heart-count-tag mt-2">
                    已有 <span id="count">0</span> 位妈咪送出了爱心
                </div>
            </div>
        </div>

        <!-- 互动 -->
        <div class="flex justify-center">
            <button onclick="sendLove(event)" class="bg-pink-500 hover:bg-pink-600 text-white w-20 h-20 rounded-full shadow-2xl flex items-center justify-center text-4xl animate-bounce">
                ❤️
            </button>
        </div>

    </main>

    <footer class="mt-auto py-10 text-pink-400/50 text-xs text-center z-10">
        <p>祝 1N、2N、3N 全体妈咪</p>
        <p class="mt-1 font-calligraphy text-base">身体健康 · 永远美丽</p>
    </footer>

    <script>
        /**
         * 照片库配置：
         * 根据你的 imagesformom 文件夹内容自动生成
         */
        const photos = [
            "https://raw.githubusercontent.com/yquan77/teaching-tools/refs/heads/main/imagesformom/IMG_2594.jpg",
            "https://raw.githubusercontent.com/yquan77/teaching-tools/refs/heads/main/imagesformom/IMG_6150.JPG",
            "https://raw.githubusercontent.com/yquan77/teaching-tools/refs/heads/main/imagesformom/IMG_7338.jpg",
            "https://raw.githubusercontent.com/yquan77/teaching-tools/refs/heads/main/imagesformom/IMG_9678.jpg"
        ];

        let currentPhotoIndex = 0;
        const imgEl = document.getElementById('display-img');
        const indexEl = document.getElementById('photo-index');

        function updatePhoto() {
            imgEl.classList.add('photo-hidden');
            
            setTimeout(() => {
                imgEl.src = photos[currentPhotoIndex];
                indexEl.innerText = `${currentPhotoIndex + 1} / ${photos.length} 张精彩瞬间`;
                imgEl.onload = () => {
                    imgEl.classList.remove('photo-hidden');
                };
            }, 300);
        }

        function nextPhoto(e) {
            if(e) e.stopPropagation();
            currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
            updatePhoto();
        }

        function prevPhoto(e) {
            if(e) e.stopPropagation();
            currentPhotoIndex = (currentPhotoIndex - 1 + photos.length) % photos.length;
            updatePhoto();
        }

        window.addEventListener('load', () => {
            indexEl.innerText = `1 / ${photos.length} 张精彩瞬间`;
        });

        const schoolWishes = [
            "“感谢各位妈咪一直以来对班级工作的支持，祝您母亲节快乐！”",
            "“每一个孩子的进步，都离不开您在背后的辛勤付出。您辛苦了！”",
            "“您的爱是孩子们成长的阳光，愿您岁岁年年，笑靥如花。”",
            "“祝 1N、2N、3N 的妈咪们：节日快乐，愿您被生活温柔以待。”",
            "“在这个特别的日子里，我们要对最伟大的您说声：谢谢！”",
            "“愿您不仅是坚强的妈妈，更是快乐的自己。”"
        ];

        let count = 0;

        function handleImageError(img) {
            console.warn("图片路径可能有误，请检查 GitHub 文件名大小写。");
            // 备用展示
            img.src = 'https://images.unsplash.com/photo-1594042494541-269335099351?auto=format&fit=crop&q=80&w=800'; 
        }

        function changeWish() {
            const el = document.getElementById('dynamic-wish');
            el.style.opacity = 0;
            setTimeout(() => {
                const randomWish = schoolWishes[Math.floor(Math.random() * schoolWishes.length)];
                el.innerText = randomWish;
                el.style.opacity = 1;
            }, 300);
        }

        function createFlower() {
            const items = ['🌸', '💖', '✨', '🌹'];
            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.innerText = items[Math.floor(Math.random() * items.length)];
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.fontSize = Math.random() * 20 + 10 + 'px';
            flower.style.animationDuration = Math.random() * 4 + 6 + 's';
            flower.style.opacity = Math.random() * 0.6 + 0.4;
            document.body.appendChild(flower);
            setTimeout(() => flower.remove(), 10000);
        }
        setInterval(createFlower, 600);

        const canvas = document.getElementById('interaction-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class LoveParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 15 + 10;
                this.speedX = (Math.random() - 0.5) * 8;
                this.speedY = Math.random() * -12 - 4;
                this.gravity = 0.3;
                this.opacity = 1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += this.gravity;
                this.opacity -= 0.015;
            }
            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.font = `${this.size}px serif`;
                ctx.fillText('❤️', this.x, this.y);
            }
        }

        function sendLove(e) {
            count++;
            document.getElementById('count').innerText = count;
            const x = (e.clientX || (e.touches && e.touches[0].clientX)) || window.innerWidth/2;
            const y = (e.clientY || (e.touches && e.touches[0].clientY)) || window.innerHeight/2;
            for (let i = 0; i < 15; i++) {
                particles.push(new LoveParticle(x, y));
            }
        }

        document.addEventListener('mousedown', (e) => {
            if(e.target.tagName !== 'BUTTON') sendLove(e);
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.update();
                p.draw();
                if (p.opacity <= 0) particles.splice(i, 1);
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
