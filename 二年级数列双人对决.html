<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>双人数字对决 - 2 Player Math Duel</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- 引入 Babel 用于解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 引入字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans SC', sans-serif; touch-action: manipulation; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out 2; }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .animate-pop { animation: pop 0.2s ease-out; }

        @keyframes slash-left {
            0% { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); opacity: 0; }
            50% { opacity: 1; }
            100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); opacity: 0; }
        }
    </style>
</head>
<body class="bg-slate-900 text-white overflow-hidden h-screen w-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        // --- 逻辑配置 ---
        const LEVELS = {
            1: { types: ['ones', 'tens'], label: '初级 (1, 10)' },
            2: { types: ['twos', 'fives'], label: '中级 (2, 5)' },
            3: { types: ['hundreds', 'twos', 'fives', 'tens'], label: '高级 (混合)' }
        };

        const generateProblem = (level = 1) => {
            const config = LEVELS[level] || LEVELS[1];
            const type = config.types[Math.floor(Math.random() * config.types.length)];
            let start, step, length = 4;
            const base = Math.floor(Math.random() * 200) + 10;

            switch (type) {
                case 'ones': step = 1; start = base; break;
                case 'twos': step = 2; start = base; break;
                case 'fives': step = 5; start = Math.floor(base / 5) * 5; break;
                case 'tens': step = 10; start = Math.floor(base / 10) * 10; break;
                case 'hundreds': step = 100; start = Math.floor(Math.random() * 3) * 100 + 100; break;
                default: step = 1; start = base;
            }

            const isAscending = Math.random() > 0.5;
            let sequence = [];
            for (let i = 0; i < length; i++) {
                sequence.push(isAscending ? start + (i * step) : start + ((length - 1 - i) * step));
            }

            const missingIndex = Math.floor(Math.random() * length);
            const answer = sequence[missingIndex];
            
            let options = [answer];
            while (options.length < 3) {
                const offset = (Math.floor(Math.random() * 3) + 1) * step;
                const distractor = Math.random() > 0.5 ? answer + offset : answer - offset;
                if (!options.includes(distractor) && distractor > 0) options.push(distractor);
            }
            
            return {
                sequence, missingIndex, answer, step, isAscending,
                // Options shuffled independently for logic, but we will shuffle display later
                options: options.sort(() => Math.random() - 0.5) 
            };
        };

        // --- 图标组件 ---
        const SwordIcon = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"></polyline>
                <line x1="13" y1="19" x2="19" y2="13"></line>
                <line x1="16" y1="16" x2="20" y2="20"></line>
                <line x1="19" y1="21" x2="21" y2="19"></line>
            </svg>
        );

        // --- 子组件 ---

        const PlayerCard = ({ id, hp, maxHp, color, isFrozen, combo, characterType, lastAction }) => {
            const isLeft = id === 1;
            const barColor = isLeft ? 'bg-blue-500' : 'bg-red-500';
            const textColor = isLeft ? 'text-blue-400' : 'text-red-400';
            const borderColor = isLeft ? 'border-blue-500' : 'border-red-500';

            return (
                <div className={`relative flex flex-col items-center justify-center p-4 transition-all duration-300 ${isFrozen ? 'opacity-50 grayscale scale-95' : 'opacity-100'}`}>
                    {/* 状态效果文字 */}
                    {lastAction && (
                        <div className={`absolute top-10 text-4xl font-black animate-pop z-20 ${lastAction === 'HIT' ? 'text-yellow-400' : 'text-red-500'}`}>
                            {lastAction === 'HIT' ? 'CRITICAL!' : 'MISS!'}
                        </div>
                    )}
                    
                    {/* 冰冻覆盖层 */}
                    {isFrozen && (
                        <div className="absolute inset-0 z-10 flex items-center justify-center">
                            <div className="text-6xl animate-bounce">❄️</div>
                        </div>
                    )}

                    {/* 角色头像 */}
                    <div className={`w-32 h-32 md:w-48 md:h-48 rounded-full border-4 ${borderColor} bg-slate-800 flex items-center justify-center shadow-[0_0_20px_rgba(0,0,0,0.5)] mb-4 relative overflow-hidden`}>
                        {id === 1 ? (
                            <svg viewBox="0 0 100 100" className="w-full h-full p-2">
                                <circle cx="50" cy="50" r="40" fill="#3B82F6" />
                                <path d="M 30 40 L 40 50 L 70 20" fill="none" stroke="white" strokeWidth="8" strokeLinecap="round" />
                                <rect x="30" y="60" width="40" height="10" rx="5" fill="white" />
                            </svg>
                        ) : (
                            <svg viewBox="0 0 100 100" className="w-full h-full p-2">
                                <rect x="20" y="20" width="60" height="60" fill="#EF4444" rx="10" />
                                <path d="M 30 30 L 45 45 M 70 30 L 55 45" stroke="white" strokeWidth="6" strokeLinecap="round" />
                                <circle cx="35" cy="40" r="3" fill="white"/>
                                <circle cx="65" cy="40" r="3" fill="white"/>
                                <path d="M 35 70 Q 50 60 65 70" stroke="white" strokeWidth="4" fill="none" />
                            </svg>
                        )}
                        {combo > 1 && (
                            <div className="absolute bottom-2 right-2 bg-yellow-500 text-black font-bold px-2 py-0.5 rounded-full text-xs shadow-lg animate-bounce">
                                x{combo}
                            </div>
                        )}
                    </div>

                    <h2 className={`text-2xl font-black ${textColor} mb-2`}>PLAYER {id}</h2>

                    {/* 血条 */}
                    <div className="w-full h-8 bg-slate-900 rounded-full border-2 border-slate-600 overflow-hidden relative shadow-inner">
                        <div 
                            className={`h-full transition-all duration-300 ${barColor}`} 
                            style={{ width: `${(hp / maxHp) * 100}%` }}
                        />
                        <div className="absolute inset-0 flex items-center justify-center text-xs font-bold text-white drop-shadow-md">
                            {hp} / {maxHp}
                        </div>
                    </div>
                </div>
            );
        };

        const OptionButton = ({ value, onClick, disabled, hotkey, colorClass }) => (
            <button 
                onClick={onClick}
                disabled={disabled}
                className={`
                    relative w-full py-4 md:py-6 rounded-xl font-black text-2xl md:text-3xl shadow-lg
                    transition-all transform active:scale-95 border-b-4 
                    ${disabled ? 'bg-slate-700 border-slate-900 text-slate-500 cursor-not-allowed' : `${colorClass} text-white`}
                `}
            >
                {value}
                {/* 键盘提示 */}
                <span className="absolute top-2 right-2 text-xs opacity-50 border border-white/30 rounded px-1.5 py-0.5 hidden md:inline-block">
                    {hotkey}
                </span>
            </button>
        );

        // --- 主游戏组件 ---

        const MathDuel = () => {
            const [gameState, setGameState] = useState('menu'); // menu, playing, end
            const [level, setLevel] = useState(1);
            const [problem, setProblem] = useState(null);
            
            // 玩家状态
            const [p1, setP1] = useState({ hp: 100, maxHp: 100, frozen: false, combo: 0, lastAction: null });
            const [p2, setP2] = useState({ hp: 100, maxHp: 100, frozen: false, combo: 0, lastAction: null });
            
            // 选项状态 (为了让两个玩家的选项顺序可能不同，或者防止误触，这里简化为相同顺序)
            const [options, setOptions] = useState([]);

            const maxHp = 100;

            // 启动游戏
            const startGame = (selectedLevel) => {
                setLevel(selectedLevel);
                setP1({ hp: maxHp, maxHp, frozen: false, combo: 0, lastAction: null });
                setP2({ hp: maxHp, maxHp, frozen: false, combo: 0, lastAction: null });
                setGameState('playing');
                nextTurn(selectedLevel);
            };

            const nextTurn = (lvl) => {
                const newProb = generateProblem(lvl);
                setProblem(newProb);
                setOptions(newProb.options); // Both players see same order to reduce confusion or create fairness
                
                // Clear action texts after a delay
                setTimeout(() => {
                    setP1(p => ({...p, lastAction: null}));
                    setP2(p => ({...p, lastAction: null}));
                }, 1000);
            };

            // 处理回答
            const handleAnswer = (player, value) => {
                const isP1 = player === 1;
                const currentPlayer = isP1 ? p1 : p2;
                const otherPlayer = isP1 ? p2 : p1;
                const setSelf = isP1 ? setP1 : setP2;
                const setOther = isP1 ? setP2 : setP1;

                if (gameState !== 'playing' || currentPlayer.frozen) return;

                if (value === problem.answer) {
                    // 正确: 攻击对方
                    const damage = 10 + (currentPlayer.combo * 2);
                    const newEnemyHp = Math.max(0, otherPlayer.hp - damage);
                    
                    setOther(prev => ({ ...prev, hp: newEnemyHp }));
                    setSelf(prev => ({ ...prev, combo: prev.combo + 1, lastAction: 'HIT' }));

                    if (newEnemyHp <= 0) {
                        setGameState('end');
                    } else {
                        nextTurn(level);
                    }
                } else {
                    // 错误: 自己冻结2秒
                    setSelf(prev => ({ ...prev, frozen: true, combo: 0, lastAction: 'MISS' }));
                    setTimeout(() => {
                        setSelf(prev => ({ ...prev, frozen: false }));
                    }, 2000);
                }
            };

            // 键盘监听
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (gameState !== 'playing' || !problem) return;

                    // P1 Keys: A (0), S (1), D (2) (Left handed standard WASD) -> Actually let's use A, W, D or just A, S, D
                    // Let's use A, S, D for indexes 0, 1, 2
                    if (e.key === 'a' || e.key === 'A') handleAnswer(1, options[0]);
                    if (e.key === 's' || e.key === 'S') handleAnswer(1, options[1]);
                    if (e.key === 'd' || e.key === 'D') handleAnswer(1, options[2]);

                    // P2 Keys: ArrowLeft, ArrowDown, ArrowRight
                    if (e.key === 'ArrowLeft') handleAnswer(2, options[0]);
                    if (e.key === 'ArrowDown') handleAnswer(2, options[1]);
                    if (e.key === 'ArrowRight') handleAnswer(2, options[2]);
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [gameState, problem, options, p1, p2]);

            // --- 界面渲染 ---

            if (gameState === 'menu') {
                return (
                    <div className="h-full flex flex-col items-center justify-center p-8 bg-slate-900 text-white relative overflow-hidden">
                        <div className="absolute inset-0 grid grid-cols-2 pointer-events-none opacity-10">
                            <div className="bg-blue-600 h-full"></div>
                            <div className="bg-red-600 h-full"></div>
                        </div>
                        
                        <div className="z-10 text-center space-y-8 animate-fade-in">
                            <div className="flex items-center justify-center gap-4 mb-4">
                                <div className="w-16 h-16 bg-blue-500 rounded-full"></div>
                                <h1 className="text-6xl font-black tracking-tighter italic">VS</h1>
                                <div className="w-16 h-16 bg-red-500 rounded-lg rotate-45"></div>
                            </div>
                            <h1 className="text-5xl md:text-7xl font-black mb-2">双人数字对决</h1>
                            <p className="text-xl text-slate-300">同屏竞技 • 谁算得更快？</p>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 w-full max-w-2xl mt-12">
                                {[1, 2, 3].map(lvl => (
                                    <button
                                        key={lvl}
                                        onClick={() => startGame(lvl)}
                                        className="py-6 px-8 bg-slate-800 hover:bg-slate-700 border-2 border-slate-600 hover:border-white rounded-2xl transition-all text-xl font-bold"
                                    >
                                        {LEVELS[lvl].label}
                                    </button>
                                ))}
                            </div>
                            
                            <div className="mt-8 text-sm text-slate-500 flex gap-8 justify-center">
                                <div className="flex flex-col items-center">
                                    <span className="font-bold text-blue-400 mb-1">玩家 1 (左)</span>
                                    <div className="flex gap-1">
                                        <kbd className="bg-slate-800 px-2 py-1 rounded border border-slate-600">A</kbd>
                                        <kbd className="bg-slate-800 px-2 py-1 rounded border border-slate-600">S</kbd>
                                        <kbd className="bg-slate-800 px-2 py-1 rounded border border-slate-600">D</kbd>
                                    </div>
                                </div>
                                <div className="flex flex-col items-center">
                                    <span className="font-bold text-red-400 mb-1">玩家 2 (右)</span>
                                    <div className="flex gap-1">
                                        <kbd className="bg-slate-800 px-2 py-1 rounded border border-slate-600">←</kbd>
                                        <kbd className="bg-slate-800 px-2 py-1 rounded border border-slate-600">↓</kbd>
                                        <kbd className="bg-slate-800 px-2 py-1 rounded border border-slate-600">→</kbd>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (gameState === 'end') {
                const winner = p1.hp > 0 ? 1 : 2;
                return (
                    <div className="h-full flex flex-col items-center justify-center bg-slate-900 z-50 relative">
                        <div className={`absolute inset-0 opacity-20 ${winner === 1 ? 'bg-blue-600' : 'bg-red-600'}`}></div>
                        <h1 className={`text-6xl md:text-8xl font-black mb-8 ${winner === 1 ? 'text-blue-400' : 'text-red-400'} animate-bounce`}>
                            玩家 {winner} 获胜!
                        </h1>
                        <button 
                            onClick={() => setGameState('menu')}
                            className="bg-white text-slate-900 px-10 py-4 rounded-full font-black text-2xl hover:scale-105 transition-transform shadow-2xl z-10"
                        >
                            再战一局
                        </button>
                    </div>
                );
            }

            return (
                <div className="h-full flex flex-col md:flex-row bg-slate-950 relative">
                    
                    {/* 中央分割线与题目区 (桌面版布局) */}
                    <div className="absolute inset-0 pointer-events-none hidden md:flex items-center justify-center z-0">
                        <div className="w-1 h-full bg-slate-800"></div>
                    </div>
                    
                    {/* 题目显示 (绝对定位在中央顶部) */}
                    <div className="absolute top-0 left-0 right-0 h-1/3 md:h-1/4 flex items-center justify-center z-10 pointer-events-none">
                         <div className="bg-slate-900/90 backdrop-blur-xl border-4 border-slate-700 px-8 py-4 md:px-12 md:py-6 rounded-3xl shadow-2xl flex flex-col items-center transform md:translate-y-4">
                            <div className="text-slate-400 text-sm md:text-base font-bold tracking-widest mb-2 uppercase">
                                {problem.isAscending ? 'Order: Ascending' : 'Order: Descending'} • Step: {problem.step}
                            </div>
                            <div className="flex items-center gap-2 md:gap-4">
                                {problem.sequence.map((num, i) => (
                                    <React.Fragment key={i}>
                                        <div className={`
                                            w-12 h-12 md:w-16 md:h-16 flex items-center justify-center rounded-lg text-xl md:text-2xl font-black
                                            ${i === problem.missingIndex ? 'bg-yellow-500 text-slate-900 animate-pulse scale-110' : 'bg-slate-800 text-slate-200'}
                                        `}>
                                            {i === problem.missingIndex ? '?' : num}
                                        </div>
                                        {i < problem.sequence.length - 1 && <div className="w-2 h-2 bg-slate-600 rounded-full"></div>}
                                    </React.Fragment>
                                ))}
                            </div>
                         </div>
                    </div>

                    {/* 玩家 1 区域 (左/上) */}
                    <div className="flex-1 relative border-b-2 md:border-b-0 md:border-r-2 border-slate-800 flex flex-col justify-end pb-8 md:pb-12 bg-gradient-to-b from-slate-900 to-blue-900/20">
                        <div className="flex-1 flex flex-col items-center justify-center pt-20">
                            <PlayerCard id={1} {...p1} />
                        </div>
                        <div className="px-4 md:px-12 grid grid-cols-3 gap-3 md:gap-6 w-full max-w-xl mx-auto z-20">
                            {options.map((opt, i) => (
                                <OptionButton 
                                    key={i} 
                                    value={opt} 
                                    onClick={() => handleAnswer(1, opt)}
                                    disabled={p1.frozen}
                                    hotkey={['A','S','D'][i]}
                                    colorClass="bg-blue-600 hover:bg-blue-500 border-blue-800 active:border-blue-900"
                                />
                            ))}
                        </div>
                    </div>

                    {/* 玩家 2 区域 (右/下) */}
                    <div className="flex-1 relative flex flex-col justify-end pb-8 md:pb-12 bg-gradient-to-b from-slate-900 to-red-900/20">
                        <div className="flex-1 flex flex-col items-center justify-center pt-20">
                            <PlayerCard id={2} {...p2} />
                        </div>
                        <div className="px-4 md:px-12 grid grid-cols-3 gap-3 md:gap-6 w-full max-w-xl mx-auto z-20">
                            {options.map((opt, i) => (
                                <OptionButton 
                                    key={i} 
                                    value={opt} 
                                    onClick={() => handleAnswer(2, opt)}
                                    disabled={p2.frozen}
                                    hotkey={['←','↓','→'][i]}
                                    colorClass="bg-red-600 hover:bg-red-500 border-red-800 active:border-red-900"
                                />
                            ))}
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MathDuel />);
    </script>
</body>
</html>
