<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学PK竞技场 (100,000以内)</title>
    
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- 引入 Babel 用于解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 引入 Tailwind CSS 用于样式 -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
        .animate-pulse-fast {
            animation: pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.2s ease-in-out 0s 2;
        }
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 内嵌图标组件 ---

        const IconSwords = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5" />
                <line x1="13" y1="19" x2="19" y2="13" />
                <line x1="16" y1="16" x2="20" y2="20" />
                <line x1="19" y1="21" x2="21" y2="19" />
            </svg>
        );

        const IconTrophy = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
                <path d="M4 22h16" />
                <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
                <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
                <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
            </svg>
        );

        const IconRefresh = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                <path d="M21 3v5h-5" />
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                <path d="M8 16H3v5" />
            </svg>
        );

        const IconSettings = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.35a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                <circle cx="12" cy="12" r="3" />
            </svg>
        );

        const IconCheckCircle = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
        );

        const IconXCircle = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10" />
                <line x1="15" y1="9" x2="9" y2="15" />
                <line x1="9" y1="9" x2="15" y2="15" />
            </svg>
        );

        const IconPlay = ({ size = 24, className = "" }) => (
             <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
        );

        const IconUserPlus = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="8.5" cy="7" r="4" />
                <line x1="20" y1="8" x2="20" y2="14" />
                <line x1="23" y1="11" x2="17" y2="11" />
            </svg>
        );

        const IconFlame = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-2.246-5.318 2.5-8.5 2.458 3.093 4.375 5.867 4.5 8.5a2.5 2.5 0 0 0 2 2.5c2 0 3-2 3-5 1 2 2 5 2 9a6 6 0 0 1-12 0C4 9 8 5 8 5s.5 5 .5 9.5Z" />
            </svg>
        );

        // --- 题目生成逻辑 ---

        const generateQuestion = () => {
            const types = ['reading', 'placeValue', 'digitValue', 'compare', 'sequence'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            let question = {};
            
            const randomNum = () => Math.floor(Math.random() * 90000) + 10000;
            
            switch (type) {
                case 'reading':
                    const n1 = Math.floor(Math.random() * 9) + 1; // 万
                    const n2 = Math.floor(Math.random() * 9);     // 千
                    const n3 = Math.floor(Math.random() * 9);     // 百
                    const val = n1 * 10000 + n2 * 1000 + n3 * 100;
                    
                    question.text = `数目 ${val} 的万位数字是？`;
                    question.options = [n1, n2, n3];
                    question.correctIndex = 0;
                    break;

                case 'placeValue': 
                    const numP = randomNum();
                    const strP = numP.toString();
                    const pos = Math.floor(Math.random() * 5); // 0-4
                    const digit = strP[pos];
                    const places = ['万位', '千位', '百位', '十位', '个位'];
                    
                    question = {
                        text: `在数目 ${numP} 中，数字 ${digit} 位于什么数位？`,
                        options: [places[pos], places[(pos+1)%5], places[(pos+2)%5]],
                        correctIndex: 0
                    };
                    break;

                case 'digitValue': 
                    const numD = randomNum();
                    const strD = numD.toString();
                    let posD = 0;
                    do { posD = Math.floor(Math.random() * 5); } while(strD[posD] === '0'); 
                    
                    const valD = parseInt(strD[posD]) * Math.pow(10, 4 - posD);
                    
                    question = {
                        text: `在数目 ${numD} 中，数字 ${strD[posD]} 的数值是多少？`,
                        options: [valD, valD/10 || 1, valD*10].sort(() => Math.random() - 0.5),
                        correctIndex: -1 
                    };
                    question.correctIndex = question.options.indexOf(valD);
                    break;

                case 'compare': 
                    const base = randomNum();
                    const diff = Math.floor(Math.random() * 100) + 1;
                    const isGreater = Math.random() > 0.5;
                    const target = isGreater ? base + diff : base - diff;
                    
                    question = {
                        text: `哪个数目比 ${base} ${isGreater ? '大' : '小'}？`,
                        options: [target, isGreater ? base - diff : base + diff, base].sort(() => Math.random() - 0.5),
                        correctIndex: -1
                    };
                    question.correctIndex = question.options.indexOf(target);
                    break;
                    
                case 'sequence': 
                    const start = randomNum();
                    const step = [10, 100, 1000][Math.floor(Math.random() * 3)];
                    question = {
                        text: `完成数列: ${start}, ${start+step}, ____, ${start+step*3}`,
                        options: [start+step*2, start+step*2 + 10, start+step*2 - 10].sort(() => Math.random() - 0.5),
                        correctIndex: -1
                    };
                    question.correctIndex = question.options.indexOf(start+step*2);
                    break;

                default: 
                    const a = Math.floor(Math.random() * 500);
                    const b = Math.floor(Math.random() * 500);
                    question = {
                        text: `${a} + ${b} = ?`,
                        options: [a+b, a+b+10, a+b-5].sort(()=>Math.random()-0.5),
                        correctIndex: -1
                    };
                    question.correctIndex = question.options.indexOf(a+b);
                    break;
            }

            if (question.correctIndex === undefined || question.correctIndex === -1) {
                question.correctIndex = 0;
            }
            
            if (question.correctIndex === 0) {
                const correctOption = question.options[0];
                question.options = question.options.sort(() => Math.random() - 0.5);
                question.correctIndex = question.options.indexOf(correctOption);
            }

            return question;
        };

        // --- 主组件 ---

        function MathPKGame() {
            // State: setup -> drawing -> ready -> playing -> winner
            const [gameState, setGameState] = useState('setup'); 
            const [studentRange, setStudentRange] = useState(41);
            const [targetScore, setTargetScore] = useState(3);
            const [players, setPlayers] = useState({ p1: null, p2: null });
            const [scores, setScores] = useState({ p1: 0, p2: 0 });
            const [combo, setCombo] = useState({ p1: 0, p2: 0 }); // 新增连击状态
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [feedback, setFeedback] = useState({ p1: null, p2: null }); 
            const [drawAnimation, setDrawAnimation] = useState({ n1: 0, n2: 0 });
            const [allWrong, setAllWrong] = useState(false); // 新增全错状态标记
            
            // drawingTarget: 'both' (新开局), 'p1' (p1是挑战者), 'p2' (p2是挑战者)
            const [drawingTarget, setDrawingTarget] = useState('both'); 

            // 启动抽签（新开局）
            const startNewDraw = () => {
                setDrawingTarget('both');
                setGameState('drawing');
                runDrawAnimation('both');
            };

            // 启动抽签（挑战者）
            const startChallengerDraw = (target) => {
                setDrawingTarget(target);
                setGameState('drawing');
                runDrawAnimation(target);
            };

            const runDrawAnimation = (target) => {
                let count = 0;
                const interval = setInterval(() => {
                    setDrawAnimation(prev => ({
                        n1: (target === 'both' || target === 'p1') ? Math.floor(Math.random() * studentRange) + 1 : prev.n1,
                        n2: (target === 'both' || target === 'p2') ? Math.floor(Math.random() * studentRange) + 1 : prev.n2
                    }));
                    count++;
                    if (count > 20) {
                        clearInterval(interval);
                        finishDraw(target);
                    }
                }, 100);
            };

            const finishDraw = (target) => {
                let newP1 = players.p1;
                let newP2 = players.p2;

                if (target === 'both') {
                    newP1 = Math.floor(Math.random() * studentRange) + 1;
                    newP2 = Math.floor(Math.random() * studentRange) + 1;
                    while (newP1 === newP2) {
                        newP2 = Math.floor(Math.random() * studentRange) + 1;
                    }
                } else if (target === 'p1') {
                    // P2是守擂者，P1换新
                    do {
                        newP1 = Math.floor(Math.random() * studentRange) + 1;
                    } while (newP1 === newP2);
                } else if (target === 'p2') {
                    // P1是守擂者，P2换新
                    do {
                        newP2 = Math.floor(Math.random() * studentRange) + 1;
                    } while (newP2 === newP1);
                }

                setPlayers({ p1: newP1, p2: newP2 });
                setScores({ p1: 0, p2: 0 }); 
                setCombo({ p1: 0, p2: 0 });
                setGameState('ready'); 
            };

            const startGame = () => {
                setGameState('playing');
                nextQuestion();
            };

            const nextQuestion = () => {
                setFeedback({ p1: null, p2: null });
                setAllWrong(false);
                setCurrentQuestion(generateQuestion());
            };

            const handleAnswer = (player, optionIndex) => {
                if (gameState !== 'playing' || feedback[player]) return; 

                const isCorrect = optionIndex === currentQuestion.correctIndex;
                const otherPlayer = player === 'p1' ? 'p2' : 'p1';
                
                if (isCorrect) {
                    const newScores = { ...scores, [player]: scores[player] + 1 };
                    setScores(newScores);
                    setCombo({ ...combo, [player]: combo[player] + 1 }); // 答对增加Combo
                    setFeedback({ ...feedback, [player]: 'correct' });
                    
                    if (newScores[player] >= targetScore) {
                        setTimeout(() => setGameState('winner'), 1000);
                    } else {
                        setTimeout(nextQuestion, 1000);
                    }
                } else {
                    // 答错逻辑
                    const newFeedback = { ...feedback, [player]: 'wrong' };
                    setFeedback(newFeedback);
                    setCombo({ ...combo, [player]: 0 }); // 答错重置Combo

                    // 检查是否双方都答错 (Bug修复)
                    if (newFeedback[otherPlayer] === 'wrong') {
                        setAllWrong(true); // 触发全错提示
                        setTimeout(nextQuestion, 1500); // 1.5秒后进入下一题
                    }
                }
            };

            const resetGame = () => {
                setGameState('setup');
                setPlayers({ p1: null, p2: null });
                setScores({ p1: 0, p2: 0 });
                setCombo({ p1: 0, p2: 0 });
            };

            const playAgainSamePlayers = () => {
                setScores({ p1: 0, p2: 0 });
                setCombo({ p1: 0, p2: 0 });
                setGameState('ready');
            };

            const playNextChallenger = () => {
                // 判断谁赢了
                if (scores.p1 > scores.p2) {
                    setDrawAnimation({ n1: players.p1, n2: players.p2 });
                    startChallengerDraw('p2');
                } else {
                    setDrawAnimation({ n1: players.p1, n2: players.p2 });
                    startChallengerDraw('p1');
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col font-sans select-none overflow-hidden">
                
                {/* 头部标题 */}
                <header className="bg-indigo-600 text-white p-4 shadow-lg flex justify-between items-center z-10">
                    <div className="flex items-center gap-2">
                    <IconSwords size={28} />
                    <h1 className="text-2xl font-bold">数学知识大比拼 (100,000以内)</h1>
                    </div>
                    {gameState === 'setup' && (
                        <div className="text-sm bg-indigo-700 px-3 py-1 rounded-full">准备阶段</div>
                    )}
                    {gameState === 'ready' && (
                        <div className="text-sm bg-indigo-700 px-3 py-1 rounded-full animate-pulse">对战准备</div>
                    )}
                    {gameState !== 'setup' && gameState !== 'ready' && (
                        <button onClick={resetGame} className="text-xs bg-indigo-500 hover:bg-indigo-400 px-3 py-1 rounded">
                            返回主页
                        </button>
                    )}
                </header>

                {/* 1. 设置界面 */}
                {gameState === 'setup' && (
                    <div className="flex-1 flex flex-col items-center justify-center p-6 animate-fade-in">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center border-b-4 border-indigo-200">
                        <IconSettings className="w-12 h-12 text-indigo-500 mx-auto mb-4" />
                        <h2 className="text-2xl font-bold text-gray-800 mb-6">游戏设置</h2>
                        
                        <div className="mb-6 text-left">
                        <label className="block text-gray-600 mb-2 font-medium">学生总人数 (1-N)</label>
                        <input 
                            type="number" 
                            value={studentRange} 
                            onChange={(e) => setStudentRange(Number(e.target.value))}
                            className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 text-lg outline-none transition"
                        />
                        </div>

                        <div className="mb-8 text-left">
                        <label className="block text-gray-600 mb-2 font-medium">获胜所需题数</label>
                        <div className="flex gap-2">
                            {[3, 5, 7, 10].map(n => (
                            <button 
                                key={n}
                                onClick={() => setTargetScore(n)}
                                className={`flex-1 py-2 rounded-lg border-2 font-bold ${targetScore === n ? 'border-indigo-600 bg-indigo-50 text-indigo-600' : 'border-gray-200 text-gray-400'}`}
                            >
                                {n}题
                            </button>
                            ))}
                        </div>
                        </div>

                        <button 
                        onClick={startNewDraw}
                        className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-4 rounded-xl text-xl font-bold hover:shadow-lg transform hover:-translate-y-1 transition duration-200 flex items-center justify-center gap-2"
                        >
                        <IconRefresh size={24} /> 开始抽签
                        </button>
                    </div>
                    </div>
                )}

                {/* 2. 抽签界面 */}
                {gameState === 'drawing' && (
                    <div className="flex-1 flex items-center justify-center bg-gray-900">
                    <div className="flex gap-12 text-center w-full max-w-4xl justify-center items-center">
                        {/* 选手 A */}
                        <div className={drawingTarget === 'both' || drawingTarget === 'p1' ? "animate-bounce" : ""}>
                            <div className="text-gray-400 text-xl mb-2">选手 A (红方)</div>
                            <div className={`w-40 h-40 rounded-full flex items-center justify-center border-4 border-white shadow-[0_0_30px_rgba(239,68,68,0.6)]
                                ${drawingTarget === 'p1' || drawingTarget === 'both' ? 'bg-red-500' : 'bg-red-700 opacity-80'}`}>
                                <span className="text-6xl font-black text-white">
                                    {(drawingTarget === 'both' || drawingTarget === 'p1') ? drawAnimation.n1 : players.p1}
                                </span>
                            </div>
                            {drawingTarget === 'p2' && <div className="mt-2 text-yellow-400 font-bold">👑 擂主</div>}
                        </div>
                        
                        <div className="flex flex-col items-center">
                            <span className="text-4xl font-bold text-white">VS</span>
                            {drawingTarget !== 'both' && <span className="text-gray-400 mt-2 text-sm">正在抽取挑战者...</span>}
                        </div>

                        {/* 选手 B */}
                        <div className={drawingTarget === 'both' || drawingTarget === 'p2' ? "animate-bounce" : ""} style={{ animationDelay: '0.1s' }}>
                            <div className="text-gray-400 text-xl mb-2">选手 B (蓝方)</div>
                            <div className={`w-40 h-40 rounded-full flex items-center justify-center border-4 border-white shadow-[0_0_30px_rgba(59,130,246,0.6)]
                                ${drawingTarget === 'p2' || drawingTarget === 'both' ? 'bg-blue-500' : 'bg-blue-700 opacity-80'}`}>
                                <span className="text-6xl font-black text-white">
                                    {(drawingTarget === 'both' || drawingTarget === 'p2') ? drawAnimation.n2 : players.p2}
                                </span>
                            </div>
                             {drawingTarget === 'p1' && <div className="mt-2 text-yellow-400 font-bold">👑 擂主</div>}
                        </div>
                    </div>
                    </div>
                )}

                {/* 2.5 准备界面 (VS) */}
                {gameState === 'ready' && (
                    <div className="flex-1 flex flex-col items-center justify-center bg-slate-800 animate-fade-in">
                        <h2 className="text-white text-3xl font-bold mb-12 tracking-wider">对战即将开始</h2>
                        <div className="flex items-center gap-16 mb-16 scale-110">
                            <div className="text-center relative">
                                <div className="w-48 h-48 bg-red-500 rounded-full flex items-center justify-center border-8 border-white shadow-2xl z-10 relative">
                                    <span className="text-7xl font-black text-white">{players.p1}</span>
                                </div>
                                <div className="mt-4 text-red-400 font-bold text-2xl">红方</div>
                            </div>

                            <div className="text-6xl font-black text-white italic opacity-80">VS</div>

                            <div className="text-center relative">
                                <div className="w-48 h-48 bg-blue-500 rounded-full flex items-center justify-center border-8 border-white shadow-2xl z-10 relative">
                                    <span className="text-7xl font-black text-white">{players.p2}</span>
                                </div>
                                <div className="mt-4 text-blue-400 font-bold text-2xl">蓝方</div>
                            </div>
                        </div>

                        <button 
                            onClick={startGame}
                            className="bg-green-500 hover:bg-green-600 text-white text-2xl font-bold py-6 px-16 rounded-2xl shadow-[0_10px_20px_rgba(0,0,0,0.3)] transform hover:scale-105 transition active:scale-95 flex items-center gap-3"
                        >
                            <IconPlay size={32} /> 开始对战
                        </button>
                    </div>
                )}

                {/* 3. 游戏主界面 (分屏) */}
                {gameState === 'playing' && currentQuestion && (
                    <div className="flex-1 flex relative">
                    
                    {/* 进度/目标指示器 */}
                    <div className="absolute top-4 left-1/2 transform -translate-x-1/2 bg-white/90 backdrop-blur px-6 py-2 rounded-full shadow-lg z-20 border border-gray-200 font-bold text-gray-700">
                        目标：答对 {targetScore} 题
                    </div>

                    {/* 全错提示 */}
                    {allWrong && (
                        <div className="absolute inset-0 z-30 flex items-center justify-center bg-black/40 backdrop-blur-[2px] animate-fade-in">
                            <div className="bg-gray-800 text-white px-8 py-4 rounded-xl shadow-2xl border-4 border-gray-600 animate-shake">
                                <h2 className="text-3xl font-bold">都没答对！😅</h2>
                                <p className="text-center mt-2 text-gray-300">跳过此题...</p>
                            </div>
                        </div>
                    )}

                    {/* 左侧玩家 (P1 - 红色) */}
                    <div className={`w-1/2 bg-red-50 flex flex-col border-r-4 border-white relative transition-opacity duration-300 ${feedback.p1 === 'wrong' ? 'opacity-60 bg-gray-100 grayscale' : ''}`}>
                        <div className="p-4 bg-red-100 flex justify-between items-center border-b border-red-200">
                        <div className="flex items-center gap-2">
                            <div className="w-10 h-10 bg-red-500 rounded-full flex items-center justify-center text-white font-bold shadow relative">
                                {players.p1}
                                {feedback.p1 === 'wrong' && (
                                    <div className="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center">
                                        ❄️
                                    </div>
                                )}
                            </div>
                            <div>
                                <span className="font-bold text-red-800 block leading-tight">红方选手</span>
                                {combo.p1 > 1 && (
                                    <span className="text-orange-500 font-black text-sm flex items-center gap-1 animate-pop">
                                        <IconFlame size={14} /> {combo.p1}连击
                                    </span>
                                )}
                            </div>
                        </div>
                        <div className="text-3xl font-black text-red-600">{scores.p1}</div>
                        </div>
                        
                        <div className="flex-1 flex flex-col justify-center p-6 gap-4">
                        {/* 题目区域 */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border-2 border-red-100 mb-4 min-h-[120px] flex items-center justify-center text-center">
                            <h3 className="text-xl font-bold text-gray-800">{currentQuestion.text}</h3>
                        </div>

                        {/* 选项按钮 */}
                        <div className="grid gap-3">
                            {currentQuestion.options.map((opt, idx) => (
                            <button 
                                key={idx}
                                disabled={feedback.p1 !== null}
                                onClick={() => handleAnswer('p1', idx)}
                                className={`
                                p-4 rounded-lg text-lg font-bold shadow-sm border-b-4 transition-all relative overflow-hidden
                                ${feedback.p1 === null 
                                    ? 'bg-red-500 text-white border-red-700 hover:bg-red-400 active:border-b-0 active:translate-y-1' 
                                    : feedback.p1 === 'wrong' 
                                    ? 'bg-gray-200 text-gray-400 border-gray-300 cursor-not-allowed'
                                    : 'bg-green-500 text-white border-green-700'
                                }
                                `}
                            >
                                {opt}
                                {feedback.p1 === 'wrong' && (
                                    <div className="absolute inset-0 flex items-center justify-center bg-gray-100/10">
                                        <span className="transform -rotate-12 text-gray-500/30 text-4xl font-black">冻结</span>
                                    </div>
                                )}
                            </button>
                            ))}
                        </div>

                        {/* 反馈状态 */}
                        {feedback.p1 && feedback.p1 !== 'wrong' && (
                            <div className={`absolute inset-0 bg-white/50 backdrop-blur-sm flex items-center justify-center z-10 ${feedback.p1 === 'correct' ? 'text-green-600' : 'text-red-500'}`}>
                                {feedback.p1 === 'correct' ? <IconCheckCircle size={80} className="animate-pop" /> : <IconXCircle size={80} />}
                            </div>
                        )}
                        </div>
                    </div>

                    {/* 右侧玩家 (P2 - 蓝色) */}
                    <div className={`w-1/2 bg-blue-50 flex flex-col border-l-4 border-white relative transition-opacity duration-300 ${feedback.p2 === 'wrong' ? 'opacity-60 bg-gray-100 grayscale' : ''}`}>
                        <div className="p-4 bg-blue-100 flex justify-between items-center border-b border-blue-200">
                        <div className="text-3xl font-black text-blue-600">{scores.p2}</div>
                        <div className="flex items-center gap-2">
                            <div className="text-right">
                                <span className="font-bold text-blue-800 block leading-tight">蓝方选手</span>
                                {combo.p2 > 1 && (
                                    <span className="text-orange-500 font-black text-sm flex items-center justify-end gap-1 animate-pop">
                                        {combo.p2}连击 <IconFlame size={14} />
                                    </span>
                                )}
                            </div>
                            <div className="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold shadow relative">
                                {players.p2}
                                {feedback.p2 === 'wrong' && (
                                    <div className="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center">
                                        ❄️
                                    </div>
                                )}
                            </div>
                        </div>
                        </div>

                        <div className="flex-1 flex flex-col justify-center p-6 gap-4">
                        {/* 题目区域 (镜像显示，方便双人看) */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border-2 border-blue-100 mb-4 min-h-[120px] flex items-center justify-center text-center">
                            <h3 className="text-xl font-bold text-gray-800">{currentQuestion.text}</h3>
                        </div>

                        {/* 选项按钮 */}
                        <div className="grid gap-3">
                            {currentQuestion.options.map((opt, idx) => (
                            <button 
                                key={idx}
                                disabled={feedback.p2 !== null}
                                onClick={() => handleAnswer('p2', idx)}
                                className={`
                                p-4 rounded-lg text-lg font-bold shadow-sm border-b-4 transition-all relative overflow-hidden
                                ${feedback.p2 === null 
                                    ? 'bg-blue-500 text-white border-blue-700 hover:bg-blue-400 active:border-b-0 active:translate-y-1' 
                                    : feedback.p2 === 'wrong' 
                                    ? 'bg-gray-200 text-gray-400 border-gray-300 cursor-not-allowed'
                                    : 'bg-green-500 text-white border-green-700'
                                }
                                `}
                            >
                                {opt}
                                {feedback.p2 === 'wrong' && (
                                    <div className="absolute inset-0 flex items-center justify-center bg-gray-100/10">
                                        <span className="transform -rotate-12 text-gray-500/30 text-4xl font-black">冻结</span>
                                    </div>
                                )}
                            </button>
                            ))}
                        </div>

                        {/* 反馈状态 */}
                        {feedback.p2 && feedback.p2 !== 'wrong' && (
                            <div className={`absolute inset-0 bg-white/50 backdrop-blur-sm flex items-center justify-center z-10 ${feedback.p2 === 'correct' ? 'text-green-600' : 'text-red-500'}`}>
                                {feedback.p2 === 'correct' ? <IconCheckCircle size={80} className="animate-pop" /> : <IconXCircle size={80} />}
                            </div>
                        )}
                        </div>
                    </div>

                    </div>
                )}

                {/* 4. 获胜界面 */}
                {gameState === 'winner' && (
                    <div className="flex-1 flex flex-col items-center justify-center bg-yellow-50 animate-fade-in p-8 text-center">
                    <IconTrophy size={80} className="text-yellow-500 mb-6 animate-bounce" />
                    <h2 className="text-4xl font-black text-gray-800 mb-2">比赛结束!</h2>
                    <p className="text-xl text-gray-600 mb-8">获胜者是</p>
                    
                    <div className={`
                        w-48 h-48 rounded-full flex items-center justify-center text-8xl font-black text-white shadow-2xl mb-12 border-8 border-white transform scale-110
                        ${scores.p1 > scores.p2 ? 'bg-red-500 shadow-red-300' : 'bg-blue-500 shadow-blue-300'}
                    `}>
                        {scores.p1 > scores.p2 ? players.p1 : players.p2}
                    </div>
                    <div className="mt-4 mb-12 text-gray-500 font-bold">
                        {scores.p1 > scores.p2 ? "红方选手" : "蓝方选手"}
                    </div>
                    
                    <div className="flex gap-4">
                        <button 
                        onClick={playNextChallenger}
                        className="px-8 py-4 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 shadow-xl transition transform hover:-translate-y-1 flex items-center gap-2"
                        >
                           <IconUserPlus size={24} /> 下一位挑战者 (赢家守擂)
                        </button>

                        <button 
                        onClick={playAgainSamePlayers}
                        className="px-6 py-4 bg-white border-2 border-gray-300 text-gray-600 font-bold rounded-xl hover:bg-gray-50 transition"
                        >
                        同一组重赛
                        </button>
                        
                        <button 
                        onClick={startNewDraw}
                        className="px-6 py-4 bg-white border-2 border-gray-300 text-gray-600 font-bold rounded-xl hover:bg-gray-50 transition"
                        >
                        重新抽签
                        </button>
                    </div>
                    </div>
                )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MathPKGame />);
    </script>
</body>
</html>
